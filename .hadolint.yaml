# Hadolint configuration — Dockerfile linter (https://github.com/hadolint/hadolint).
# Shared by every entry point that lints our Dockerfiles: `just dockerfile-lint`
# (also part of `just ci`), the pre-commit `hadolint` hook, and the CI hadolint
# step. Hadolint discovers this file from the repo root (its current working
# directory), so all of them read the same rules.

# Only allow base images pulled from registries we actually use. A FROM that
# points anywhere else fails DL3026 — a guard against typo-squatted or
# unexpected image sources. Our images come from Docker Hub (debian, node,
# nginx) and GHCR (astral-sh/uv).
trustedRegistries:
  - docker.io
  - ghcr.io
