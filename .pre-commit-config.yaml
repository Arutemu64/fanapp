# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
exclude: '^(\.agent|\.agents|\.claude)/'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Matches the version of Ruff installed in your environment
    rev: v0.15.14
    hooks:
      # Run the linter
      - id: ruff-check
        args: [ --fix ]
        files: ^backend/
      # Run the formatter
      - id: ruff-format
        files: ^backend/

  - repo: local
    hooks:
      - id: ty
        name: ty
        entry: uv run --directory backend ty check src/fanfan
        language: system
        types: [ python ]
        pass_filenames: false
