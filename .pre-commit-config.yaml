# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
exclude: '^(\.agent|\.agents|\.claude)/'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # --unsafe checks YAML syntax without constructing custom tags, which
        # docker-compose uses (!reset / !override for merge control).
        args: [--unsafe]
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Matches the version of Ruff installed in your environment
    rev: v0.15.21
    hooks:
      # Run the linter
      - id: ruff-check
        args: [ --fix ]
        files: ^backend/
      # Run the formatter
      - id: ruff-format
        files: ^backend/

  - repo: local
    hooks:
      - id: ty
        name: ty
        entry: uv run --directory backend ty check src/fanfan
        language: system
        types: [ python ]
        pass_filenames: false

      - id: frontend-prettier
        name: frontend prettier
        entry: bash -c 'cd frontend && pnpm exec prettier --check "${@#frontend/}"' --
        language: system
        files: ^frontend/
        types_or: [ svelte, ts, javascript, css, json ]

      - id: frontend-eslint
        name: frontend eslint
        entry: bash -c 'cd frontend && pnpm exec eslint "${@#frontend/}"' --
        language: system
        files: ^frontend/
        types_or: [ svelte, ts, javascript ]

      - id: frontend-check
        name: frontend svelte-check
        entry: bash -c 'cd frontend && pnpm check'
        language: system
        files: ^frontend/
        types_or: [ svelte, ts ]
        pass_filenames: false
