# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
exclude: '^(\.agent|\.agents|\.claude)/'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # --unsafe checks YAML syntax without constructing custom tags, which
        # docker-compose uses (!reset / !override for merge control).
        args: [--unsafe]
      - id: check-added-large-files

  # Lint Dockerfiles with hadolint via its Docker image, so contributors need no
  # local hadolint binary. Reads .hadolint.yaml from the repo root, matching the
  # CI hadolint job and `just docker-lint`. Requires a running Docker daemon.
  - repo: https://github.com/hadolint/hadolint
    rev: v2.14.0
    hooks:
      - id: hadolint-docker

  - repo: local
    hooks:
      # Ruff runs as a local hook (not the astral-sh/ruff-pre-commit mirror) so
      # its version has a single source of truth: backend/uv.lock. This avoids
      # drift between a mirror `rev` and the pinned ruff. Same targets as CI
      # (src/fanfan tests); pass_filenames is off because `uv run --directory
      # backend` changes cwd, which would break repo-root-relative file args.
      - id: ruff-check
        name: ruff check
        entry: uv run --directory backend ruff check --fix src/fanfan tests
        language: system
        files: ^backend/
        types: [ python ]
        pass_filenames: false

      - id: ruff-format
        name: ruff format
        entry: uv run --directory backend ruff format src/fanfan tests
        language: system
        files: ^backend/
        types: [ python ]
        pass_filenames: false

      - id: ty
        name: ty
        entry: uv run --directory backend ty check src/fanfan
        language: system
        types: [ python ]
        pass_filenames: false

      - id: frontend-prettier
        name: frontend prettier
        entry: bash -c 'cd frontend && pnpm exec prettier --check "${@#frontend/}"' --
        language: system
        files: ^frontend/
        types_or: [ svelte, ts, javascript, css, json ]

      - id: frontend-eslint
        name: frontend eslint
        entry: bash -c 'cd frontend && pnpm exec eslint "${@#frontend/}"' --
        language: system
        files: ^frontend/
        types_or: [ svelte, ts, javascript ]

      - id: frontend-check
        name: frontend svelte-check
        entry: bash -c 'cd frontend && pnpm check'
        language: system
        files: ^frontend/
        types_or: [ svelte, ts ]
        pass_filenames: false
