exclude: '^(\.agent|\.agents)/'

default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--disallow-unknown-tags, --allow-multiple-documents]
        exclude: '^docker-compose(\.[a-z0-9]+)?\.ya?ml$'
      - id: check-yaml
        name: check-yaml (compose)
        files: '^docker-compose(\.[a-z0-9]+)?\.ya?ml$'
      - id: check-added-large-files

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --directory backend ruff check --fix src/fanfan tests scripts
        language: system
        files: ^backend/
        types: [python]
        pass_filenames: false

      - id: ruff-format
        name: ruff format
        entry: uv run --directory backend ruff format src/fanfan tests scripts
        language: system
        files: ^backend/
        types: [python]
        pass_filenames: false

      - id: uv-sort
        name: uv-sort
        entry: uv run --directory backend uv-sort
        language: system
        files: ^backend/pyproject\.toml$
        pass_filenames: false

      - id: ty
        name: ty
        entry: uv run --directory backend ty check
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]

      - id: frontend-prettier
        name: frontend prettier
        entry: bash -c 'cd frontend && pnpm exec prettier --check "${@#frontend/}"' --
        language: system
        files: ^frontend/
        types_or: [svelte, ts, javascript, css, json]

      - id: root-prettier
        name: root prettier (markdown, yaml)
        entry: frontend/node_modules/.bin/prettier --check
        language: system
        types_or: [markdown, yaml]
        exclude: ^frontend/

      - id: frontend-eslint
        name: frontend eslint
        entry: bash -c 'cd frontend && pnpm exec eslint "${@#frontend/}"' --
        language: system
        files: ^frontend/
        types_or: [svelte, ts, javascript]

      - id: frontend-check
        name: frontend svelte-check
        entry: bash -c 'cd frontend && pnpm check'
        language: system
        files: ^frontend/
        types_or: [svelte, ts]
        pass_filenames: false
        stages: [pre-push]
