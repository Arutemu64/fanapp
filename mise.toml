# Toolchain pins for the FAN FAN monorepo. Install everything with `mise install`
# (https://mise.jdx.dev) so every contributor gets the same runtimes — no
# version drift. asdf reads the same versions via the generated .tool-versions.
#
# Docker + Docker Compose are NOT managed here (system-level); install them
# separately for the full `just run-dev` environment.
[tools]
python = "3.14.6"   # backend requires-python >= 3.14
node = "24"       # LTS
pnpm = "11.15.0"  # matches frontend/package.json "packageManager"
uv = "0.11.29"  # matches backend/Dockerfile and backend/pyproject.toml [tool.uv]
just = "latest"
hadolint = "2.14.0"  # Dockerfile linter; keep in sync with .pre-commit-config.yaml rev (CI uses hadolint-action)
