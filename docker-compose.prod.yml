services:
  frontend:
    image: ghcr.io/arutemu64/fanapp-frontend:${IMAGE_TAG:-latest}
    build: !reset null
    networks:
      proxy:
        aliases: ["${COMPOSE_PROJECT_NAME:-fanapp}-frontend"]

  api:
    image: ghcr.io/arutemu64/fanapp-backend:${IMAGE_TAG:-latest}
    build: !reset null
    networks:
      proxy:
        aliases: ["${COMPOSE_PROJECT_NAME:-fanapp}-api"]

  worker:
    image: ghcr.io/arutemu64/fanapp-backend:${IMAGE_TAG:-latest}
    build: !reset null

  migration:
    image: ghcr.io/arutemu64/fanapp-backend:${IMAGE_TAG:-latest}
    build: !reset null

networks:
  proxy:
    external: true
