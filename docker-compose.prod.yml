# Production overlay: run prebuilt images from the GitHub Container Registry
# (GHCR) instead of building from source on the server.
#
# NOTE for forks / self-hosters: the prebuilt frontend image is a static SPA with
# its PUBLIC_* values (incl. the domain / API URL) baked in at build time, so
# these images are domain-locked to the maintainer's deployment. To run on your
# own domain, do NOT use this overlay — build from source with your own root
# `.env` instead (`just run-prod`). See the Frontend section of `.env.example`.
#
# Usage on the server (always together with the base file):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile core --profile ops pull
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile core --profile ops up -d
# (or simply `just deploy`).
#
# Pin a specific build for a reproducible deploy or a rollback by setting
# IMAGE_TAG in .env, e.g. `IMAGE_TAG=sha-1a2b3c4`. Defaults to `latest`, which
# the publish workflow moves to the newest build on `main`.
#
# `build: !reset null` drops the `build:` config inherited from the base file so
# the server can never accidentally rebuild from source — it only ever pulls.
# (Requires Docker Compose v2.24+ for the `!reset` tag.)
services:
  frontend:
    image: ghcr.io/arutemu64/fanapp-frontend:${IMAGE_TAG:-latest}
    build: !reset null
    # Join the shared `proxy` network so a reverse proxy that runs as its own
    # container on the VPS (fronting several independent stacks, not part of this
    # Compose project) can reach the SPA by name. The host-port bindings in the
    # base file stay — they remain the SSH-tunnel/debug seam. The alias is
    # project-prefixed on purpose: on a shared network Docker DNS resolves the
    # bare service name (`frontend`) too, and if another stack on `proxy` also
    # has a `frontend`, DNS returns both and round-robins silently. Point the
    # proxy at `fanapp-frontend:80` to stay unambiguous. Only added on the deploy
    # path (prod overlay) so local `run-dev` / CI don't require the external net.
    networks:
      proxy:
        aliases: [fanapp-frontend]

  api:
    image: ghcr.io/arutemu64/fanapp-backend:${IMAGE_TAG:-latest}
    build: !reset null
    # Same shared-proxy join as frontend — the API must be on `proxy` too or the
    # proxy's /api route stays refused. Route it at `fanapp-api:8000`. Keeps its
    # base-file frontend-network / backend-network memberships (Compose merges).
    networks:
      proxy:
        aliases: [fanapp-api]

  faststream:
    image: ghcr.io/arutemu64/fanapp-backend:${IMAGE_TAG:-latest}
    build: !reset null

  scheduler:
    image: ghcr.io/arutemu64/fanapp-backend:${IMAGE_TAG:-latest}
    build: !reset null

  bot:
    image: ghcr.io/arutemu64/fanapp-backend:${IMAGE_TAG:-latest}
    build: !reset null

  migration:
    image: ghcr.io/arutemu64/fanapp-backend:${IMAGE_TAG:-latest}
    build: !reset null

# The reverse proxy on the VPS runs as its own container outside this project, so
# the network it shares with us is `external` — Compose attaches to it but never
# creates or removes it. Create it once on the server before the first deploy:
#   docker network create proxy
# then connect the proxy container to it (`docker network connect proxy <caddy>`).
networks:
  proxy:
    external: true
