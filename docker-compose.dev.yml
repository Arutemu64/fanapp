services:
  frontend:
    build:
      target: dev
    image: fanapp-frontend-dev
    environment:
      NODE_ENV: development
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app
          initial_sync: true
          ignore:
            - node_modules/
            - .svelte-kit/
            - build/
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/pnpm-lock.yaml

  api:
    environment:
      UVICORN_RELOAD: "true"
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
          initial_sync: true
          ignore:
            - .venv/
        - action: rebuild
          path: ./backend/uv.lock

  faststream:
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
          initial_sync: true
          ignore:
            - .venv/
        - action: rebuild
          path: ./backend/uv.lock
