services:
  frontend:
    build:
      target: dev
    image: fanapp-frontend-dev
    environment:
      NODE_ENV: development
      # The app calls the API with a relative base (`/api`); vite proxies it to
      # the `api` container on the Compose network (see frontend/vite.config.ts).
      VITE_API_PROXY_TARGET: "http://api:8000"
    # Don't block the UI on the whole backend health chain (db -> migration ->
    # redis/nats -> api). Vite's `/api` proxy connects lazily per request, so the
    # frontend needs nothing from the API at boot — start it in parallel and let
    # API calls succeed once the backend is up. `!reset` drops the base file's
    # `depends_on: api` (Compose 2.24+).
    depends_on: !reset null
    # The dev container runs `vite dev` on port 3000 (not the prod NGINX :80).
    # `!override` REPLACES the base service's port list — without it Compose
    # merges port lists additively, leaving a dead 3000:80 mapping alongside this
    # one and a host-port-3000 collision (Compose 2.24+).
    ports: !override
      - '127.0.0.1:3000:3000'
    # Persist Vite's dependency pre-bundle cache (node_modules/.vite) across
    # container recreations so `vite dev` doesn't cold-rebundle deps on every
    # start. The watch sync excludes node_modules/, so this named volume is the
    # only copy that survives a recreate. Vite invalidates it automatically when
    # the lockfile or vite.config changes, so a stale cache is never served.
    volumes:
      - frontend-vite-cache:/app/node_modules/.vite
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app
          initial_sync: true
          ignore:
            - node_modules/
            - .svelte-kit/
            - build/
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/pnpm-lock.yaml

  api:
    read_only: false
    environment:
      UVICORN_RELOAD: "true"
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
          initial_sync: true
          ignore:
            - .venv/
        - action: rebuild
          path: ./backend/uv.lock

  faststream:
    read_only: false
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
          initial_sync: true
          ignore:
            - .venv/
        - action: rebuild
          path: ./backend/uv.lock

volumes:
  frontend-vite-cache: {}
