services:
  frontend:
    build:
      target: dev
    image: fanapp-frontend-dev
    deploy:
      resources:
        limits:
          memory: 1G
    environment:
      NODE_ENV: development
      VITE_API_PROXY_TARGET: "http://api:8000"
      FRONTEND_PORT: "${FRONTEND_PORT:-3000}"
    ports: !override
      - '127.0.0.1:${FRONTEND_PORT:-3000}:${FRONTEND_PORT:-3000}'
    volumes:
      - frontend-vite-cache:/app/node_modules/.vite
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app
          initial_sync: true
          ignore:
            - node_modules/
            - .svelte-kit/
            - build/
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/pnpm-lock.yaml

  api:
    read_only: false
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      UVICORN_RELOAD: "true"
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
          initial_sync: true
          ignore:
            - .venv/
        - action: rebuild
          path: ./backend/uv.lock

  worker:
    read_only: false
    command: [ "faststream", "run", "--factory", "--reload", "fanfan.main.worker:create_app" ]
    deploy:
      resources:
        limits:
          memory: 512M
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
          initial_sync: true
          ignore:
            - .venv/
        - action: rebuild
          path: ./backend/uv.lock

volumes:
  frontend-vite-cache: {}
