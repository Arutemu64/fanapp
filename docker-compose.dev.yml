services:
  frontend:
    build:
      target: dev
    environment:
      NODE_ENV: development
      HOST: "0.0.0.0"
      PORT: "5173"
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app
          initial_sync: true
          ignore:
            - node_modules/
            - .svelte-kit/
            - build/
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/pnpm-lock.yaml

  api:
    environment:
      UVICORN_RELOAD: "true"
    ports:
      - '8000:8000'
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
          initial_sync: true
          ignore:
            - .venv/
        - action: rebuild
          path: ./backend/uv.lock
  
  faststream:
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
          initial_sync: true
          ignore:
            - .venv/
        - action: rebuild
          path: ./backend/uv.lock

  db:
    ports:
      - '5432:5432'

  redis:
    ports:
      - '6379:6379'

  nats:
    ports:
      - '4222:4222'
