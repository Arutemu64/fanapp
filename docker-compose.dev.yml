services:
  frontend:
    build:
      target: dev
    image: fanapp-frontend-dev
    # The base compose caps frontend memory at 128M — right for the prod NGINX
    # static server, but the dev stage runs a full Node/Vite dev server whose
    # esbuild dependency optimizer peaks well above that. At 128M the optimizer
    # gets OOM-killed mid "bundling dependencies", the restart policy respawns
    # it, and it crash-loops forever without ever serving. Raise the ceiling for
    # dev only.
    deploy:
      resources:
        limits:
          memory: 1G
    environment:
      NODE_ENV: development
      # The app calls the API with a relative base (`/api`); vite proxies it to
      # the `api` container on the Compose network (see frontend/vite.config.ts).
      VITE_API_PROXY_TARGET: "http://api:8000"
      # vite reads FRONTEND_PORT (see vite.config.ts) so the dev server listens on
      # exactly the port published below. Default 3000 keeps the upstream Caddy
      # config unchanged.
      FRONTEND_PORT: "${FRONTEND_PORT:-3000}"
    # The dev container runs `vite dev` on FRONTEND_PORT (not the prod NGINX :80).
    # Host and container side use the same port so the mapping stays valid for any
    # override. `!override` REPLACES the base service's port list — without it
    # Compose merges port lists additively, leaving a dead :80 mapping alongside
    # this one and a host-port collision (Compose 2.24+).
    ports: !override
      - '127.0.0.1:${FRONTEND_PORT:-3000}:${FRONTEND_PORT:-3000}'
    # Persist Vite's dependency pre-bundle cache (node_modules/.vite) across
    # container recreations so `vite dev` doesn't cold-rebundle deps on every
    # start. The watch sync excludes node_modules/, so this named volume is the
    # only copy that survives a recreate. Vite invalidates it automatically when
    # the lockfile or vite.config changes, so a stale cache is never served.
    volumes:
      - frontend-vite-cache:/app/node_modules/.vite
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app
          initial_sync: true
          ignore:
            - node_modules/
            - .svelte-kit/
            - build/
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/pnpm-lock.yaml

  api:
    read_only: false
    environment:
      UVICORN_RELOAD: "true"
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
          initial_sync: true
          ignore:
            - .venv/
        - action: rebuild
          path: ./backend/uv.lock

  faststream:
    read_only: false
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
          initial_sync: true
          ignore:
            - .venv/
        - action: rebuild
          path: ./backend/uv.lock

volumes:
  frontend-vite-cache: {}
