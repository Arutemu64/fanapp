services:
  frontend:
    image: fanapp-frontend-prod
    build:
      context: ./frontend
      target: prod
      args:
        SENTRY_AUTH_TOKEN: ${DEBUG__SENTRY_AUTH_TOKEN}
    environment:
      HOST: "0.0.0.0"
      PORT: "3000"
      # We sit behind Caddy, which terminates TLS and forwards plain HTTP to us.
      # Tell adapter-node to read the real public scheme/host from Caddy's
      # X-Forwarded-* headers when building event.url. Without these it assumes
      # http:// during SSR, so a same-origin https://<site>/api call looks
      # cross-origin and SvelteKit's SSR CORS simulation rejects it (the bug
      # where pages fail only during server-side rendering).
      PROTOCOL_HEADER: "x-forwarded-proto"
      HOST_HEADER: "x-forwarded-host"
    env_file:
      - .env
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '127.0.0.1:3000:3000'
    restart: unless-stopped
    profiles: [ "core" ]
    networks:
      - frontend-network

  api:
    build: ./backend
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro
    env_file:
      - .env
    environment:
      DB__HOST: "db"
      REDIS__HOST: "redis"
      NATS__HOST: "nats"
      UVICORN_HOST: "0.0.0.0"
      UVICORN_PORT: "8000"
      UVICORN_FORWARDED_ALLOW_IPS: "*"
      UVICORN_ROOT_PATH: "/api"
      PUSH__PRIVATE_KEY_PATH: "/app/config/private_key.pem"
      PUSH__PUBLIC_KEY_PATH: "/app/config/public_key.pem"
    ports:
      - '127.0.0.1:8000:8000'
    restart: unless-stopped
    stop_signal: SIGINT
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    profiles: [ "core" ]
    networks:
      - frontend-network
      - backend-network

  faststream:
    build: ./backend
    depends_on:
      migration:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro
    env_file:
      - .env
    environment:
      DB__HOST: "db"
      REDIS__HOST: "redis"
      NATS__HOST: "nats"
      PUSH__PRIVATE_KEY_PATH: "/app/config/private_key.pem"
      PUSH__PUBLIC_KEY_PATH: "/app/config/public_key.pem"
    command: [ "faststream", "run", "--factory", "fanfan.main.faststream:create_app" ]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      disable: true
    profiles: [ "core" ]
    networks:
      - backend-network

  scheduler:
    build: ./backend
    depends_on:
      migration:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro
    env_file:
      - .env
    environment:
      DB__HOST: "db"
      REDIS__HOST: "redis"
      NATS__HOST: "nats"
    command: [ "scheduler" ]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      disable: true
    profiles: [ "core" ]
    networks:
      - backend-network

  migration:
    build: ./backend
    env_file:
      - .env
    environment:
      DB__HOST: "db"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/alembic.ini:/app/alembic.ini:ro
    command: [ "alembic", "upgrade", "head" ]
    restart: on-failure
    profiles: [ "core" ]
    networks:
      - backend-network

  db:
    image: postgres:18-alpine
    volumes:
      - db-data:/var/lib/postgresql
    environment:
      POSTGRES_USER: "${DB__USER}"
      POSTGRES_PASSWORD: "${DB__PASSWORD}"
      POSTGRES_DB: "${DB__NAME}"
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}" ]
      interval: 2s
      timeout: 60s
      retries: 10
      start_period: 5s
    profiles: [ "core" ]
    networks:
      - backend-network

  nats:
    image: nats:2.14-alpine
    volumes:
      - nats-data:/data
    command: "--js --sd=/data -m 8222 --user ${NATS__USER} --pass ${NATS__PASSWORD}"
    ports:
      - "127.0.0.1:4222:4222"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 5s
      timeout: 5s
      retries: 3
    profiles: [ "core" ]
    networks:
      - backend-network

  pgbackup:
    image: prodrigestivill/postgres-backup-local:18-alpine
    depends_on:
      - db
    volumes:
      - pgbackup-data:/backups
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=${DB__NAME}
      - POSTGRES_USER=${DB__USER}
      - POSTGRES_PASSWORD=${DB__PASSWORD}
      - POSTGRES_EXTRA_OPTS=-Z1 --schema=public --blobs
      - SCHEDULE=@every 6h00m00s
      - BACKUP_ON_START=TRUE
      - BACKUP_KEEP_DAYS=7
      - BACKUP_KEEP_WEEKS=4
      - BACKUP_KEEP_MONTHS=6
    restart: unless-stopped
    profiles: [ "ops" ]
    networks:
      - backend-network

  redis:
    image: valkey/valkey:9.1-alpine
    environment:
      REDIS__PASSWORD: "${REDIS__PASSWORD}"
    volumes:
      - redis-data:/data
      - ./config/redis/redis.conf:/usr/local/etc/valkey/valkey.conf:ro
    command: "valkey-server /usr/local/etc/valkey/valkey.conf --requirepass ${REDIS__PASSWORD}"
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS__PASSWORD}\" valkey-cli ping | grep PONG" ]
      interval: 5s
      timeout: 20s
      retries: 5
    profiles: [ "core" ]
    networks:
      - backend-network

volumes:
  db-data: {}
  pgbackup-data: {}
  redis-data: {}
  nats-data: {}

networks:
  frontend-network:
    driver: bridge
  backend-network:
    driver: bridge
