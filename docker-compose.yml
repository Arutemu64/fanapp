services:
  frontend:
    image: fanapp-frontend-prod
    build:
      context: ./frontend
      target: prod
      args:
        PUBLIC_API_URL: ${PUBLIC_API_URL}
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL}
        PUBLIC_TIMEZONE: ${PUBLIC_TIMEZONE}
        PUBLIC_VAPID_KEY: ${PUBLIC_VAPID_KEY}
        PUBLIC_SENTRY_DSN: ${PUBLIC_SENTRY_DSN}
        PUBLIC_SENTRY_ENVIRONMENT: ${PUBLIC_SENTRY_ENVIRONMENT}
        PUBLIC_SENTRY_TRACES_SAMPLE_RATE: ${PUBLIC_SENTRY_TRACES_SAMPLE_RATE}
        PUBLIC_UMAMI_SCRIPT_URL: ${PUBLIC_UMAMI_SCRIPT_URL}
        PUBLIC_UMAMI_WEBSITE_ID: ${PUBLIC_UMAMI_WEBSITE_ID}
        PUBLIC_VK_GROUP_ID: ${PUBLIC_VK_GROUP_ID}
        PUBLIC_TELEGRAM_BOT_USERNAME: ${PUBLIC_TELEGRAM_BOT_USERNAME}
        APP_VERSION: ${APP_VERSION:-}
        SENTRY_URL: ${SENTRY_URL}
        SENTRY_ORG: ${SENTRY_ORG}
        SENTRY_PROJECT: ${SENTRY_PROJECT}
      secrets:
        - sentry_auth_token
    env_file:
      - .env
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:80"
    restart: unless-stopped
    init: true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 64M
    profiles: ["core"]
    networks:
      - frontend-network

  api:
    build: ./backend
    depends_on:
      migration:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
    volumes:
      - ./secrets:/app/secrets:ro
    env_file:
      - .env
    environment:
      DB__HOST: "db"
      DB__APPLICATION_NAME: "fanfan-api"
      DB__POOL_SIZE: "10"
      DB__MAX_OVERFLOW: "10"
      NATS__HOST: "nats"
      UVICORN_HOST: "0.0.0.0"
      UVICORN_PORT: "8000"
      UVICORN_FORWARDED_ALLOW_IPS: "*"
      UVICORN_ROOT_PATH: "/api"
      UVICORN_TIMEOUT_GRACEFUL_SHUTDOWN: "5"
      PUSH__PRIVATE_KEY_PATH: "/app/secrets/private_key.pem"
      PUSH__PUBLIC_KEY_PATH: "/app/secrets/public_key.pem"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    restart: unless-stopped
    stop_signal: SIGINT
    init: true
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
    profiles: ["core"]
    networks:
      - frontend-network
      - backend-network

  worker:
    build: ./backend
    depends_on:
      migration:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
    volumes:
      - ./secrets:/app/secrets:ro
    env_file:
      - .env
    environment:
      DB__HOST: "db"
      DB__APPLICATION_NAME: "fanfan-worker"
      DB__POOL_SIZE: "5"
      DB__MAX_OVERFLOW: "10"
      NATS__HOST: "nats"
      PUSH__PRIVATE_KEY_PATH: "/app/secrets/private_key.pem"
      PUSH__PUBLIC_KEY_PATH: "/app/secrets/public_key.pem"
    command: ["faststream", "run", "--factory", "fanfan.main.worker:create_app"]
    stop_grace_period: 20s
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    profiles: ["core"]
    networks:
      - backend-network

  migration:
    build: ./backend
    env_file:
      - .env
    environment:
      DB__HOST: "db"
      NATS__HOST: "nats"
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: on-failure
    init: true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
    profiles: ["core"]
    networks:
      - backend-network

  db:
    image: postgres:18.6-alpine
    volumes:
      - db-data:/var/lib/postgresql
    environment:
      POSTGRES_USER: "${DB__USER}"
      POSTGRES_PASSWORD: "${DB__PASSWORD}"
      POSTGRES_DB: "${DB__NAME}"
    ports:
      - "127.0.0.1:5432:5432"
    shm_size: 128mb
    command:
      - postgres
      - -c
      - effective_cache_size=512MB
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - work_mem=8MB
      - -c
      - jit=off
      - -c
      - max_connections=60
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 2s
      timeout: 60s
      retries: 10
      start_period: 5s
    profiles: ["core"]
    networks:
      - backend-network

  nats:
    image: nats:2.14-alpine
    volumes:
      - nats-data:/data
    configs:
      - source: nats-conf
        target: /etc/nats/nats.conf
    command: "-c /etc/nats/nats.conf -m 8222 --user ${NATS__USER} --pass ${NATS__PASSWORD}"
    ports:
      - "127.0.0.1:4222:4222"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 96M
    environment:
      GOMEMLIMIT: "86MiB"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 5s
      timeout: 5s
      retries: 3
    profiles: ["core"]
    networks:
      - backend-network

  pgbackup:
    image: prodrigestivill/postgres-backup-local:18-alpine
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backups:/backups
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=${DB__NAME}
      - POSTGRES_USER=${DB__USER}
      - POSTGRES_PASSWORD=${DB__PASSWORD}
      - POSTGRES_EXTRA_OPTS=-Fc -Z zstd
      - BACKUP_SUFFIX=.dump
      - SCHEDULE=@every 6h00m00s
      - BACKUP_ON_START=TRUE
      - BACKUP_KEEP_DAYS=7
      - BACKUP_KEEP_WEEKS=4
      - BACKUP_KEEP_MONTHS=6
      - HEALTHCHECK_PORT=8080
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 96M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    profiles: ["ops"]
    networks:
      - backend-network

configs:
  nats-conf:
    content: |
      jetstream {
        store_dir: "/data"

        sync_interval: "10s"

        max_memory_store: 16MB
        max_file_store: 1GB
      }

secrets:
  sentry_auth_token:
    environment: DEBUG__SENTRY_AUTH_TOKEN

volumes:
  db-data: {}
  nats-data: {}

networks:
  frontend-network:
    driver: bridge
  backend-network:
    driver: bridge
