services:
  frontend:
    image: fanapp-frontend-prod
    build:
      context: ./frontend
      target: prod
      # PUBLIC_* are baked into the SPA bundle at build time ($env/static/public);
      # the static NGINX container has no way to inject them at runtime. They are
      # public, non-secret constants.
      args:
        PUBLIC_API_URL: ${PUBLIC_API_URL}
        PUBLIC_VAPID_KEY: ${PUBLIC_VAPID_KEY}
        PUBLIC_SENTRY_DSN: ${PUBLIC_SENTRY_DSN}
        PUBLIC_TURNSTILE_SITE_KEY: ${PUBLIC_TURNSTILE_SITE_KEY}
      # The Sentry token (source-map upload) is a real secret, so it enters the
      # build as a BuildKit secret (never stored in layers or build caches)
      # instead of a build arg. Empty token = upload skipped.
      secrets:
        - sentry_auth_token
    # env_file is kept for the dev overlay (vite dev reads PUBLIC_* at runtime).
    # The prod NGINX container ignores these — its values are already baked in.
    env_file:
      - .env
    # No depends_on the API: the frontend is a static SPA (NGINX in prod, vite in
    # dev) that never talks to the API at boot — browser /api calls are routed to
    # the api container by the upstream Caddy, not by this container. Gating the
    # frontend on API health would turn any backend outage into a total blackout
    # (even the static shell wouldn't serve); decoupled, the UI stays up and
    # degrades gracefully while the backend recovers.
    # Host port defaults to 3000 so the upstream Caddy reverse proxy is unchanged;
    # override with FRONTEND_PORT in .env to avoid a collision. NGINX listens on
    # 80 inside the container regardless (only the host side is remapped).
    ports:
      - '127.0.0.1:${FRONTEND_PORT:-3000}:80'
    restart: unless-stopped
    init: true
    # Limits are conservative defaults sized for a small VPS — tune to the host.
    # A hit limit shows up as throttling (CPU) or an OOM kill (memory).
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    profiles: [ "core" ]
    networks:
      - frontend-network

  api:
    build: ./backend
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    volumes:
      - ./secrets:/app/secrets:ro
    env_file:
      - .env
    environment:
      DB__HOST: "db"
      DB__APPLICATION_NAME: "fanfan-api"
      REDIS__HOST: "redis"
      NATS__HOST: "nats"
      UVICORN_HOST: "0.0.0.0"
      UVICORN_PORT: "8000"
      UVICORN_FORWARDED_ALLOW_IPS: "*"
      UVICORN_ROOT_PATH: "/api"
      PUSH__PRIVATE_KEY_PATH: "/app/secrets/private_key.pem"
      PUSH__PUBLIC_KEY_PATH: "/app/secrets/public_key.pem"
    # Host port defaults to 8000; override with API_PORT in .env to avoid a
    # collision. The container always listens on 8000 (UVICORN_PORT above) — only
    # the host side is remapped. If you change this, update Caddyfile too.
    ports:
      - '127.0.0.1:${API_PORT:-8000}:8000'
    restart: unless-stopped
    stop_signal: SIGINT
    init: true
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    profiles: [ "core" ]
    networks:
      - frontend-network
      - backend-network

  faststream:
    build: ./backend
    depends_on:
      migration:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./secrets:/app/secrets:ro
    env_file:
      - .env
    environment:
      DB__HOST: "db"
      DB__APPLICATION_NAME: "fanfan-faststream"
      REDIS__HOST: "redis"
      NATS__HOST: "nats"
      PUSH__PRIVATE_KEY_PATH: "/app/secrets/private_key.pem"
      PUSH__PUBLIC_KEY_PATH: "/app/secrets/public_key.pem"
    command: [ "faststream", "run", "--factory", "fanfan.main.faststream:create_app" ]
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      disable: true
    profiles: [ "core" ]
    networks:
      - backend-network

  scheduler:
    build: ./backend
    depends_on:
      migration:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./secrets:/app/secrets:ro
    env_file:
      - .env
    environment:
      DB__HOST: "db"
      DB__APPLICATION_NAME: "fanfan-scheduler"
      REDIS__HOST: "redis"
      NATS__HOST: "nats"
    command: [ "scheduler" ]
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    healthcheck:
      disable: true
    profiles: [ "core" ]
    networks:
      - backend-network

  migration:
    build: ./backend
    env_file:
      - .env
    environment:
      DB__HOST: "db"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/alembic.ini:/app/alembic.ini:ro
    command: [ "alembic", "upgrade", "head" ]
    restart: on-failure
    init: true
    profiles: [ "core" ]
    networks:
      - backend-network

  db:
    # Pinned (not a floating minor tag) so dev/prod, the Alembic autogenerate
    # script, and the integration test suite all run the exact same image —
    # see backend/scripts/generate_migration.py and
    # backend/tests/fixtures/db_provider.py.
    image: postgres:18.4-alpine
    volumes:
      - db-data:/var/lib/postgresql
    environment:
      POSTGRES_USER: "${DB__USER}"
      POSTGRES_PASSWORD: "${DB__PASSWORD}"
      POSTGRES_DB: "${DB__NAME}"
    # Published on loopback only — unreachable from the internet, but reachable
    # through an SSH tunnel so desktop DB clients (DBeaver etc.) can connect:
    #   ssh -L 5433:127.0.0.1:5432 <server>  →  client connects to localhost:5433
    ports:
      - "127.0.0.1:5432:5432"
    # Postgres uses /dev/shm for parallel workers; Docker's 64M default is too
    # small and surfaces as "no space left on device" under load.
    shm_size: 128mb
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}" ]
      interval: 2s
      timeout: 60s
      retries: 10
      start_period: 5s
    profiles: [ "core" ]
    networks:
      - backend-network

  nats:
    image: nats:2.14-alpine
    volumes:
      - nats-data:/data
    command: "--js --sd=/data -m 8222 --user ${NATS__USER} --pass ${NATS__PASSWORD}"
    ports:
      - "127.0.0.1:4222:4222"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 5s
      timeout: 5s
      retries: 3
    profiles: [ "core" ]
    networks:
      - backend-network

  pgbackup:
    image: prodrigestivill/postgres-backup-local:18-alpine
    # BACKUP_ON_START fires immediately, so wait for a ready Postgres instead of
    # a merely started container.
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pgbackup-data:/backups
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=${DB__NAME}
      - POSTGRES_USER=${DB__USER}
      - POSTGRES_PASSWORD=${DB__PASSWORD}
      - POSTGRES_EXTRA_OPTS=-Z1 --schema=public --blobs
      - SCHEDULE=@every 6h00m00s
      - BACKUP_ON_START=TRUE
      - BACKUP_KEEP_DAYS=7
      - BACKUP_KEEP_WEEKS=4
      - BACKUP_KEEP_MONTHS=6
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    restart: unless-stopped
    profiles: [ "ops" ]
    networks:
      - backend-network

  redis:
    image: valkey/valkey:9.1-alpine
    environment:
      REDIS__PASSWORD: "${REDIS__PASSWORD}"
    volumes:
      - redis-data:/data
      - ./config/redis/redis.conf:/usr/local/etc/valkey/valkey.conf:ro
    command: "valkey-server /usr/local/etc/valkey/valkey.conf --requirepass ${REDIS__PASSWORD}"
    ports:
      - "127.0.0.1:6379:6379"
    # valkey.conf sets maxmemory 192mb (allkeys-lru) as the in-process ceiling;
    # this container limit sits above it as a backstop, with headroom for the
    # copy-on-write spike during RDB saves.
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS__PASSWORD}\" valkey-cli ping | grep PONG" ]
      interval: 5s
      timeout: 20s
      retries: 5
    profiles: [ "core" ]
    networks:
      - backend-network

# Build-time secret for the frontend image, sourced from .env. Present but
# empty in most setups (the upload is skipped); see .env.example.
secrets:
  sentry_auth_token:
    environment: DEBUG__SENTRY_AUTH_TOKEN

volumes:
  db-data: {}
  pgbackup-data: {}
  redis-data: {}
  nats-data: {}

networks:
  frontend-network:
    driver: bridge
  backend-network:
    driver: bridge
