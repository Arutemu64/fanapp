<!doctype html>
<html lang="ru">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>ФАН ФАН</title>
		<link rel="manifest" href="/manifest.json" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="alternate icon" href="/favicon.ico" />
		<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="ФАН ФАН" />
		<meta name="theme-color" content="#ffffff" />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="ФАН ФАН" />
		<meta property="og:title" content="ФАН ФАН" />
		<meta
			property="og:description"
			content="Приложение-компаньон зрителя на аниме-фестивале ФАН ФАН: программа выступлений, голосование и пуш-уведомления."
		/>
		<meta property="og:locale" content="ru_RU" />
		<meta property="og:url" content="%sveltekit.env.PUBLIC_SITE_URL%/" />
		<meta property="og:image" content="%sveltekit.env.PUBLIC_SITE_URL%/og-image.png" />
		<meta property="og:image:type" content="image/png" />
		<meta property="og:image:width" content="512" />
		<meta property="og:image:height" content="512" />
		<meta property="og:image:alt" content="ФАН ФАН — приложение-компаньон фестиваля" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="ФАН ФАН" />
		<meta
			name="twitter:description"
			content="Приложение-компаньон зрителя на аниме-фестивале ФАН ФАН: программа выступлений, голосование и пуш-уведомления."
		/>
		<meta name="twitter:image" content="%sveltekit.env.PUBLIC_SITE_URL%/og-image.png" />
		<meta name="twitter:image:alt" content="ФАН ФАН — приложение-компаньон фестиваля" />
		<script>
			(function () {
				var m = null;
				try {
					m = localStorage.getItem('theme-mode');
				} catch (e) {}
				var isDark =
					m === 'dark' ||
					(m !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
				document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
				if (isDark) {
					document.documentElement.classList.add('dark');
					var meta = document.querySelector('meta[name="theme-color"]');
					if (meta) meta.setAttribute('content', '#0a0a0a');
				}
			})();
		</script>
		<style>
			#app-splash {
				position: fixed;
				inset: 0;
				z-index: 9999;
				display: flex;
				align-items: center;
				justify-content: center;
				background: var(--background, #ffffff);
			}
			.app-splash__mark {
				width: 4rem;
				height: 4rem;
				opacity: 0;
				animation:
					app-splash-in 0.3s ease-out 0.4s forwards,
					app-splash-pulse 1.6s ease-in-out 0.7s infinite;
			}
			@media (prefers-reduced-motion: reduce) {
				.app-splash__mark {
					animation: app-splash-in 0s linear 0.4s forwards;
				}
			}
			@keyframes app-splash-in {
				to {
					opacity: 1;
				}
			}
			@keyframes app-splash-pulse {
				0%,
				100% {
					opacity: 1;
				}
				50% {
					opacity: 0.55;
				}
			}
			.app-splash__label {
				position: absolute;
				width: 1px;
				height: 1px;
				overflow: hidden;
				clip-path: inset(50%);
				white-space: nowrap;
			}
		</style>
		%sveltekit.head%
	</head>

	<body class="bg-background" data-sveltekit-preload-data="hover">
		<div id="app-splash" role="status" aria-live="polite">
			<img class="app-splash__mark" src="/favicon.svg" alt="" width="64" height="64" />
			<span class="app-splash__label"></span>
		</div>
		<script>
			setTimeout(function () {
				var label = document.querySelector('#app-splash .app-splash__label');
				if (label) label.textContent = 'Загружаем…';
			}, 400);
		</script>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
