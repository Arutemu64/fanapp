<!doctype html>
<html lang="ru">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="manifest" href="/manifest.json" />
		<!-- SVG for browsers that support it (Chrome/Firefox/Edge); ICO as the fallback
			(Safari, plus browsers that only ever probe /favicon.ico by convention). -->
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="alternate icon" href="/favicon.ico" />
		<!-- iOS reads this for the home-screen icon (it ignores manifest icons). -->
		<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
		<!-- Run standalone (no Safari chrome) when launched from the iOS home screen.
			Modern iOS also honors the manifest's display:standalone, but these legacy
			Apple metas are still required for the status-bar style and app title. -->
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="ФАН ФАН" />
		<!-- Tints the mobile browser UI; watermelon pink in light, dark gray in dark mode. -->
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#d61450" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111827" />
		<script>
			(function () {
				var m = localStorage.getItem('theme-mode');
				if (
					m === 'dark' ||
					(m !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
				) {
					document.documentElement.classList.add('dark');
				}
			})();
		</script>
		<!--
			SPA boot splash. As a client-rendered app nothing is painted
			until the JS bundle loads and the root layout resolves /me/. This static
			overlay shows a spinner during that gap; the root layout removes it on mount.
			Plain CSS (no JS/Svelte) so it renders instantly before the bundle arrives.
		-->
		<style>
			#app-splash {
				position: fixed;
				inset: 0;
				z-index: 9999;
				display: flex;
				align-items: center;
				justify-content: center;
				background: #ffffff;
			}
			.dark #app-splash {
				background: #111827;
			}
			.app-splash__spinner {
				width: 2.5rem;
				height: 2.5rem;
				border-radius: 9999px;
				border: 3px solid rgba(214, 20, 80, 0.25);
				border-top-color: #d61450;
				animation: app-splash-spin 0.7s linear infinite;
			}
			@media (prefers-reduced-motion: reduce) {
				.app-splash__spinner {
					animation-duration: 2s;
				}
			}
			@keyframes app-splash-spin {
				to {
					transform: rotate(360deg);
				}
			}
		</style>
		%sveltekit.head%
	</head>

	<body class="bg-white dark:bg-gray-900" data-sveltekit-preload-data="hover">
		<div id="app-splash" aria-hidden="true">
			<div class="app-splash__spinner"></div>
		</div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
