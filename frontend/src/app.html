<!doctype html>
<html lang="ru">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="manifest" href="/manifest.json" />
		<!-- iOS reads this for the home-screen icon (it ignores manifest icons). -->
		<link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
		<!-- Tints the mobile browser UI; brand coral in light, dark gray in dark mode. -->
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ef562f" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111827" />
		<script>
			(function () {
				var m = localStorage.getItem('theme-mode');
				if (
					m === 'dark' ||
					(m !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
				) {
					document.documentElement.classList.add('dark');
				}
			})();
		</script>
		%sveltekit.head%
	</head>

	<body class="bg-white dark:bg-gray-900" data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
