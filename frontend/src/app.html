<!doctype html>
<html lang="ru">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<title>ФАН ФАН</title>
		<link rel="manifest" href="/manifest.json" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="alternate icon" href="/favicon.ico" />
		<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="ФАН ФАН" />
		<meta name="theme-color" content="#ffffff" />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="ФАН ФАН" />
		<meta property="og:title" content="ФАН ФАН" />
		<meta
			property="og:description"
			content="Приложение-компаньон зрителя на аниме-фестивале ФАН ФАН: программа выступлений, голосование и пуш-уведомления."
		/>
		<meta property="og:locale" content="ru_RU" />
		<meta property="og:url" content="%sveltekit.env.PUBLIC_SITE_URL%/" />
		<meta property="og:image" content="%sveltekit.env.PUBLIC_SITE_URL%/og-image.png" />
		<meta property="og:image:type" content="image/png" />
		<meta property="og:image:width" content="512" />
		<meta property="og:image:height" content="512" />
		<meta property="og:image:alt" content="ФАН ФАН — приложение-компаньон фестиваля" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="ФАН ФАН" />
		<meta
			name="twitter:description"
			content="Приложение-компаньон зрителя на аниме-фестивале ФАН ФАН: программа выступлений, голосование и пуш-уведомления."
		/>
		<meta name="twitter:image" content="%sveltekit.env.PUBLIC_SITE_URL%/og-image.png" />
		<meta name="twitter:image:alt" content="ФАН ФАН — приложение-компаньон фестиваля" />
		<meta name="color-scheme" content="light dark" />
		<script>
			(function () {
				var m = null;
				try {
					m = localStorage.getItem('theme-mode');
				} catch (e) {}
				var isDark =
					m === 'dark' ||
					(m !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
				if (m === 'dark' || m === 'light') {
					document.querySelector('meta[name="color-scheme"]').content = m;
				}
				if (isDark) {
					document.documentElement.classList.add('dark');
					var meta = document.querySelector('meta[name="theme-color"]');
					if (meta) meta.setAttribute('content', '#0a0a0a');
				}
			})();
		</script>
		<style>
			:root {
				color-scheme: light dark;
			}
			:root:has(> head > meta[name='color-scheme'][content='light']) {
				color-scheme: light;
			}
			:root:has(> head > meta[name='color-scheme'][content='dark']) {
				color-scheme: dark;
			}
			#app-splash {
				position: fixed;
				inset: 0;
				z-index: 9999;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				padding: 1rem;
				background: var(--background, light-dark(#ffffff, #0a0a0a));
				color: var(--foreground, light-dark(#0a0a0a, #fafafa));
			}
			.app-splash__recovery {
				text-align: center;
			}
			.app-splash__recovery button {
				min-height: 44px;
				padding: 0.5rem 1rem;
				border: 1px solid currentColor;
				border-radius: 999px;
				background: transparent;
				color: inherit;
				font: inherit;
				cursor: pointer;
			}
			.app-splash__mark {
				width: 4rem;
				height: 4rem;
				opacity: 0;
				animation:
					app-splash-in 0.3s ease-out 0.4s forwards,
					app-splash-pulse 1.6s ease-in-out 0.7s infinite;
			}
			@media (prefers-reduced-motion: reduce) {
				.app-splash__mark {
					animation: app-splash-in 0s linear 0.4s forwards;
				}
			}
			@keyframes app-splash-in {
				to {
					opacity: 1;
				}
			}
			@keyframes app-splash-pulse {
				0%,
				100% {
					opacity: 1;
				}
				50% {
					opacity: 0.55;
				}
			}
			.app-splash__label {
				position: absolute;
				width: 1px;
				height: 1px;
				overflow: hidden;
				clip-path: inset(50%);
				white-space: nowrap;
			}
		</style>
		<script>
			const watchAppStartup = (() => {
				const startup = new AbortController();
				const failedPreloads = new Set();
				window.addEventListener(
					'error',
					({ target }) => {
						if (target instanceof HTMLLinkElement && target.rel === 'modulepreload') {
							failedPreloads.add(target.href);
						}
					},
					{ capture: true, signal: startup.signal }
				);

				let reloading = false;
				async function reloadPage() {
					if (reloading) return;
					reloading = true;
					// WebKit can reuse a failed module preload across reloads.
					const refresh = new AbortController();
					const timeout = setTimeout(() => refresh.abort(), 2_000);
					await Promise.allSettled(
						Array.from(failedPreloads, async (url) => {
							const response = await fetch(url, { cache: 'reload', signal: refresh.signal });
							await response.arrayBuffer();
						})
					);
					clearTimeout(timeout);
					if (!startup.signal.aborted) location.reload();
				}

				// Share the reload guard with hooks.client.ts, which loads after the entry imports.
				function canReloadAutomatically() {
					if (!navigator.onLine) return false;
					const key = 'preload-error-reloaded-at';
					const now = Date.now();
					try {
						if (now - Number(sessionStorage.getItem(key)) < 30_000) return false;
						sessionStorage.setItem(key, String(now));
						return true;
					} catch {
						return false;
					}
				}

				return (splash) => {
					const label = splash.querySelector('[role="status"]');
					const recovery = splash.querySelector('.app-splash__recovery');
					const retry = recovery.querySelector('button');
					const showLoading = setTimeout(() => (label.textContent = 'Загружаем…'), 400);
					retry.addEventListener('click', reloadPage);

					window.addEventListener(
						'unhandledrejection',
						(event) => {
							if (!splash.isConnected || event.defaultPrevented) return;
							const reason = event.reason?.message ?? event.reason;
							if (
								typeof reason !== 'string' ||
								!/dynamically imported module|Importing a module script failed/i.test(reason)
							)
								return;
							event.preventDefault();
							if (reloading) return;
							if (canReloadAutomatically()) {
								void reloadPage();
								return;
							}
							clearTimeout(showLoading);
							label.textContent = '';
							splash.querySelector('img').hidden = true;
							recovery.hidden = false;
							retry.focus();
						},
						{ signal: startup.signal }
					);

					const observer = new MutationObserver(() => {
						if (splash.isConnected) return;
						observer.disconnect();
						startup.abort();
						clearTimeout(showLoading);
					});
					observer.observe(splash.parentNode, { childList: true });
				};
			})();
		</script>
		%sveltekit.head%
	</head>

	<body class="bg-background" data-sveltekit-preload-data="hover">
		<div id="app-splash">
			<img class="app-splash__mark" src="/favicon.svg" alt="" width="64" height="64" />
			<span class="app-splash__label" role="status"></span>
			<div class="app-splash__recovery" hidden>
				<p id="app-splash-error">Не удалось открыть приложение.</p>
				<button type="button" aria-describedby="app-splash-error">Обновить страницу</button>
			</div>
		</div>
		<script>
			watchAppStartup(document.getElementById('app-splash'));
		</script>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
