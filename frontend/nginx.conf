# NGINX config for serving the SvelteKit SPA built by adapter-static.
# The app is fully client-rendered, so every unknown route must fall back to
# the SPA shell (200.html) and let the client router resolve it.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index 200.html;

    # Gzip text assets. The big win (Brotli) is left to the upstream Caddy,
    # which terminates TLS in front of this container.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Hashed build assets are immutable — cache them hard.
    location /_app/immutable/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The service worker must never be cached, or clients get stuck on an old
    # version and stop receiving updates.
    location = /service-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # SPA routing: serve the requested file if it exists, otherwise hand the
    # request to the client-side router via the fallback shell.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /200.html;
    }
}
