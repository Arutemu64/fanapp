# NGINX config for serving the SvelteKit SPA built by adapter-static.
# The app is fully client-rendered, so every unknown route must fall back to
# the SPA shell (200.html) and let the client router resolve it.
#
# This container is also the stack's web edge: besides the SPA it reverse-
# proxies /api to the FastAPI backend so the browser sees a single origin (no
# CORS, first-party cookies). The upstream Caddy still terminates TLS in front.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index 200.html;

    # API reverse proxy. The trailing slash on proxy_pass strips the /api
    # prefix before forwarding; the backend runs with UVICORN_ROOT_PATH=/api,
    # so it still generates correct public URLs and OpenAPI paths.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Server-Sent Events stream. HTTP/1.1 (not NGINX's default 1.0 to upstream)
    # enables chunked transfer + keep-alive, and buffering must be off or events
    # are held back instead of streamed. Long read timeout keeps the stream open.
    location /api/events {
        proxy_pass http://api:8000/events;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }

    # Gzip text assets. The big win (Brotli) is left to the upstream Caddy,
    # which terminates TLS in front of this container.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Hashed build assets are immutable — cache them hard.
    location /_app/immutable/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The service worker must never be cached, or clients get stuck on an old
    # version and stop receiving updates.
    location = /service-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # SPA routing: serve the requested file if it exists, otherwise hand the
    # request to the client-side router via the fallback shell.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /200.html;
    }
}
