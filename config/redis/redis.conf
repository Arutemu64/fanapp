# Valkey config for the FAN FAN companion app.
# This store holds only regenerable, TTL'd data: web sessions, auth tokens,
# rate-limit counters, and short-lived locks. There is no system-of-record
# data here, so both the memory policy and persistence are tuned to degrade
# gracefully rather than to guarantee durability.

# Listen on all interfaces inside the container. This is safe because the
# host only publishes the port on 127.0.0.1 (see docker-compose.yml), the
# service sits on an isolated Docker network, and access requires a password
# (--requirepass, passed on the command line so it stays out of this
# committed, non-secret file).
bind 0.0.0.0

# Memory ceiling. Kept below the container's 256M limit so Valkey evicts keys
# itself instead of being OOM-killed by the kernel, with headroom for the
# copy-on-write spike during RDB saves. Without this, the default noeviction
# policy makes writes (logins, token issue, rate-limit increments) fail as
# memory fills, right before the container is killed.
maxmemory 192mb

# Every key here carries a TTL and is regenerable, so evicting the coldest
# keys under memory pressure (a user re-logs in, a rate-limit window resets)
# is strictly better than failing writes.
maxmemory-policy allkeys-lru

# RDB snapshots. Enough to survive a restart without logging everyone out;
# some minutes of data loss on a hard crash is acceptable for this data.
save 900 1
save 300 10
save 60 10000

# A failed background snapshot must not take the app down. Persistence here is
# best-effort, so keep serving writes even if a save fails (default is `yes`,
# which stops all writes until the next successful save).
stop-writes-on-bgsave-error no
