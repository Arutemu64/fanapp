# NATS JetStream config for the FAN FAN companion app.
#
# Defining this jetstream block is what ENABLES JetStream (store_dir set here),
# so the CLI carries no --js/--sd — only auth (--user/--pass, kept off this
# committed file) and monitoring (-m 8222). A --js flag on the command line
# would override this block and silently reset sync_interval to its default.
jetstream {
  # Matches the nats-data volume mount in docker-compose.yml.
  store_dir: "/data"

  # How often the filestore is fsync'd to disk. The default is 2 minutes:
  # JetStream acks a publish immediately but only flushes every sync_interval,
  # so a host crash (power loss, kernel panic) in that window drops writes that
  # were already acknowledged (nats-server#7564; Jepsen NATS 2.12.1, 2025-12).
  # We run single-node with no replication, so there is no second replica to
  # recover from — the fsync window IS the durability guarantee. This matters
  # because the outbox marks a row published once NATS acks it and never
  # redelivers it (see presentation/faststream/jstream.py), so an event lost in
  # the fsync window is lost on both sides. 10s shrinks that window 12x from the
  # 120s default at negligible I/O cost for this traffic. Not "always" (fsync
  # before every ack): this stream also carries ephemeral SSE subjects, and a
  # per-message fsync would add disk latency to real-time delivery for no gain.
  sync_interval: "10s"
}
