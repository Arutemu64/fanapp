[project]
name = "fanfan-bot"
version = "1.1.1"
authors = [
    { name = "Arutemu64", email = "arutemu64@outlook.com" },
]
description = "Festival bot"
requires-python = ">=3.14"
dependencies = [
    "adaptix>=3.0.0b8",
    "aiogram>=3.13.1",
    "alembic-postgresql-enum>=1.5.0",
    "alembic>=1.13.3",
    "apscheduler>=3.11,<4",
    "asyncpg>=0.31.0",
    "authlib>=1.6.9",
    "click>=8.1.8",
    "descanso>=0.7.1",
    "dishka-faststream>=0.6.0",
    "dishka>=1.4.0",
    "fastapi-mail>=1.6.2",
    "fastapi>=0.115.2",
    "faststream[cli,nats]",
    "greenlet>=3.1.1",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.4",
    "sentry-sdk[fastapi,sqlalchemy]>=2.0.0",
    "nh3>=0.3.3",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-extra-types>=2.9.0",
    "pydantic-settings>=2.6.1",
    "pydantic[email,timezone]>=2.9.2",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.22",
    "pytz>=2025.2",
    "qrcode[pil]>=8.0",
    "redis>=5.1.1",
    "rich>=13.9.3",
    "sqlalchemy>=2.0.36",
    "sse-starlette>=3.3.2",
    "structlog>=24.4.0",
    "uvicorn>=0.32.0",
    "webpush>=1.0.6",
    "polars>=1.41.2",
    "fastexcel>=0.20.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.7.0",
    "pre-commit>=3.7.1",
    "testcontainers>=4.14.2",
    "types-authlib>=1.6.9.20260303",
    "uv-sort>=0.2.1",
    "ty>=0.0.40",
    "import-linter>=2.11",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Change both to session-scope so one loop is used for the whole run
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
addopts = ["--strict-markers"]
markers = [
    "integration: tests that use real infrastructure such as PostgreSQL or Redis containers",
    "unit: fast, pure tests with no infrastructure (no DB, Redis, or DI container)",
]
testpaths = ["tests"]
filterwarnings = [
    # Our ORM models map branded NewType columns; SQLAlchemy warns about
    # resolving them implicitly. Tracked separately from the test suite.
    "ignore:Matching the provided NewType",
    # testcontainers' Redis module uses a deprecated wait decorator internally.
    "ignore:The @wait_container_is_ready decorator is deprecated",
]

[tool.coverage.run]
source = ["fanfan"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.uv.build-backend]
module-name = "fanfan"

# Architectural boundary enforcement (run via `just backend-import-lint`).
# Keeps the Clean/Hexagonal layering from docs/backend.md honest: inner layers
# must never import outer ones. See AGENTS.md constraint #5.
[tool.importlinter]
root_package = "fanfan"

[[tool.importlinter.contracts]]
name = "core stays pure (no outward imports)"
type = "forbidden"
source_modules = ["fanfan.core"]
forbidden_modules = [
    "fanfan.application",
    "fanfan.adapters",
    "fanfan.presentation",
    "fanfan.main",
]

[[tool.importlinter.contracts]]
name = "application depends only on core (not on adapters/presentation)"
type = "forbidden"
source_modules = ["fanfan.application"]
forbidden_modules = [
    "fanfan.adapters",
    "fanfan.presentation",
    "fanfan.main",
]
# Sanctioned anti-corruption layers: the cosplay2 / TicketsCloud vendor sync
# interactors and service legitimately translate vendor wire formats, so they
# may import their own vendor adapter's client + DTOs. See docs/backend.md
# ("Anti-corruption layers"). Any OTHER application -> adapters import is a bug.
ignore_imports = [
    "fanfan.application.interactors.cosplay2.sync_cosplay2 -> fanfan.adapters.api.cosplay2.client",
    "fanfan.application.interactors.cosplay2.sync_cosplay2 -> fanfan.adapters.api.cosplay2.config",
    "fanfan.application.interactors.cosplay2.sync_cosplay2 -> fanfan.adapters.api.cosplay2.dto.requests",
    "fanfan.application.interactors.cosplay2.sync_cosplay2 -> fanfan.adapters.api.cosplay2.dto.topics",
    "fanfan.application.interactors.ticketscloud.sync_tcloud -> fanfan.adapters.api.ticketscloud.client",
    "fanfan.application.interactors.ticketscloud.process_tcloud_order -> fanfan.adapters.api.ticketscloud.dto.order",
    "fanfan.application.services.ticketscloud -> fanfan.adapters.api.ticketscloud.config",
    "fanfan.application.services.ticketscloud -> fanfan.adapters.api.ticketscloud.dto.order",
]

[project.scripts]
web = "fanfan.main.web:main"
stream = "fanfan.main.faststream:main"
cli = "fanfan.main.cli:main"
scheduler = "fanfan.main.scheduler:main"
