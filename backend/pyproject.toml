[project]
name = "fanfan-bot"
version = "1.1.1"
authors = [
    { name = "Arutemu64", email = "arutemu64@outlook.com" },
]
description = "Festival bot"
requires-python = ">=3.14"
dependencies = [
    "adaptix>=3.0.0b8",
    "aiogram>=3.13.1",
    "alembic-postgresql-enum>=1.5.0",
    "alembic>=1.13.3",
    "asyncpg>=0.31.0",
    "authlib>=1.6.9",
    "click>=8.1.8",
    "descanso>=0.7.1",
    "dishka-faststream>=0.6.0",
    "dishka>=1.4.0",
    "fastapi-mail>=1.6.2",
    "fastapi>=0.115.2",
    "faststream[cli,nats]",
    "greenlet>=3.1.1",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.4",
    "logfire[aiohttp,fastapi,redis,sqlalchemy,system-metrics]>=3.16.0",
    "nh3>=0.3.3",
    "numpy>=2.1.2",
    "openpyxl>=3.1.5",
    "pandas-stubs==2.3.3.251201",
    "pandas>=2.2.3",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-extra-types>=2.9.0",
    "pydantic-settings>=2.6.1",
    "pydantic[email,timezone]>=2.9.2",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.22",
    "pytz>=2025.2",
    "qrcode[pil]>=8.0",
    "redis>=5.1.1",
    "rich>=13.9.3",
    "sqlalchemy>=2.0.36",
    "sse-starlette>=3.3.2",
    "structlog>=24.4.0",
    "uvicorn>=0.32.0",
    "webpush>=1.0.6",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.7.0",
    "testcontainers>=4.14.2",
    "types-authlib>=1.6.9.20260303",
    "uv-sort>=0.2.1",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Change both to session-scope so one loop is used for the whole run
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
markers = [
    "integration: tests that use real infrastructure such as PostgreSQL or Redis containers",
]
testpaths = ["tests"]

[tool.uv.build-backend]
module-name = "fanfan"

[project.scripts]
migrate = "fanfan.main.migration:main"
bot = "fanfan.main.bot:main"
web = "fanfan.main.web:main"
stream = "fanfan.main.stream:main"
cli = "fanfan.main.cli:main"
