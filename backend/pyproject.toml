[project]
name = "fanfan"
version = "2.1.0"
authors = [
    { name = "Arutemu64", email = "arutemu64@outlook.com" },
]
description = "Backend for the FAN FAN convention companion web app: HTTP API and background workers"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "adaptix>=3.0.0b12",
    "aiosmtplib>=5.1.2",
    "alembic>=1.20.0",
    "altcha>=2.3.0",
    "authlib>=1.9.1",
    "click>=8.5.0",
    "dishka-faststream>=0.7.0",
    "dishka>=1.10.1",
    "fastapi>=0.143.0",
    "faststream[cli,nats]>=0.7.7",
    "httptools>=0.9.0",
    "httpx2>=2.13.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "nh3>=0.3.7",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-extra-types>=2.11.1",
    "pydantic-settings>=2.16.0",
    "pydantic[email,timezone]>=2.13.5",
    "python-calamine>=0.8.2",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "rich>=15.0.0",
    "sentry-sdk[fastapi,sqlalchemy]>=2.71.0,<3",
    "sqlalchemy[asyncio]>=2.1.4",
    "structlog>=26.1.0",
    "uvicorn>=0.54.0",
    "uvloop>=0.23.0 ; sys_platform != 'win32'",
    "webpush>=1.0.6",
]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "prek>=0.5.5",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "testcontainers>=4.15.0",
    "ty>=0.0.79",
    "types-authlib>=1.8.0.20260911",
    "uv-sort>=0.8.0",
    "vulture>=2.16",
    "xlsxwriter>=3.2.9",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.uv]
required-version = "==0.13.0"
exclude-newer = "7 days"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
addopts = ["--strict-markers"]
filterwarnings = ["error"]
markers = [
    "integration: tests that use real infrastructure such as PostgreSQL containers",
    "unit: fast, pure tests with no infrastructure (no DB or DI container)",
]
testpaths = ["tests"]

[tool.ty.src]
include = ["src/fanfan", "tests", "scripts"]

[tool.ty.rules]
blanket-ignore-comment = "error"
division-by-zero = "error"
dynamic-function-decorator-return = "error"
missing-direct-dependency = "error"
missing-override-decorator = "error"
missing-type-argument = "error"
possibly-missing-attribute = "error"
possibly-missing-import = "error"
possibly-unresolved-reference = "error"
redundant-condition-strict = "error"
unsound-assignment = "error"
unsound-return-statement = "error"
unsound-yield = "error"
unsupported-dynamic-base = "error"

[[tool.ty.overrides]]
include = ["src/fanfan/adapters/db/models/**"]

[tool.ty.overrides.rules]
unsound-assignment = "ignore"

[tool.ty.analysis]
strict-equality-semantics = true
strict-generic-narrowing = true

[tool.coverage.run]
source = ["fanfan"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.vulture]
paths = ["src/fanfan", "vulture_whitelist.py"]
min_confidence = 80
exclude = [
    "src/fanfan/adapters/db/migrations/",
]
ignore_decorators = [
    "@*_router.*",
    "@provide",
    "@inject",
    "@click.*",
    "@async_command",
    "@field_validator",
    "@model_validator",
    "@declared_attr",
    "@declared_attr.*",
]

[tool.uv.build-backend]
module-name = "fanfan"

[tool.importlinter]
root_package = "fanfan"

[[tool.importlinter.contracts]]
name = "core stays pure (no outward imports)"
type = "forbidden"
source_modules = ["fanfan.core"]
forbidden_modules = [
    "fanfan.application",
    "fanfan.adapters",
    "fanfan.presentation",
    "fanfan.main",
]

[[tool.importlinter.contracts]]
name = "application depends only on core (not on adapters/presentation)"
type = "forbidden"
source_modules = ["fanfan.application"]
forbidden_modules = [
    "fanfan.adapters",
    "fanfan.presentation",
    "fanfan.main",
]

[project.scripts]
web = "fanfan.main.web:main"
worker = "fanfan.main.worker:main"
cli = "fanfan.main.cli:main"
generate-vapid = "fanfan.main.generate_vapid:main"
