[project]
name = "fanfan"
# Release version for the whole repo, frontend included — bump it here and move
# the matching `vX.Y.Z` git tag in the same change. frontend/package.json stays
# at a 0.0.0 placeholder rather than carrying a second, independently drifting
# number. A running deploy is identified by its commit SHA, not by this.
# See docs/dependencies.md, "Versioning the app".
version = "2.1.0"
authors = [
    { name = "Arutemu64", email = "arutemu64@outlook.com" },
]
description = "Backend for the FAN FAN convention companion web app: HTTP API, Telegram bot and background workers"
# The LICENSE file lives at the monorepo root, outside this project dir, so
# PEP 639 `license-files` cannot reference it (no `..` allowed).
license = "MIT"
requires-python = ">=3.14.6"
dependencies = [
    "adaptix>=3.0.0b12",
    "aiogram>=3.30.0",
    "alembic>=1.18.5",
    "apscheduler>=3.11.3,<4",
    "asyncpg>=0.31.0",
    "authlib>=1.7.2",
    "click>=8.4.2",
    "dishka-faststream>=0.7.0",
    "dishka>=1.10.1",
    "fastapi-mail>=1.6.5",
    "fastapi>=0.140.0",
    "faststream[cli,nats]>=0.7.2",
    "greenlet>=3.5.4",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "sentry-sdk[fastapi,sqlalchemy]>=2.66.1",
    "nh3>=0.3.6",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-extra-types>=2.11.1",
    "pydantic-settings>=2.14.2",
    "pydantic[email,timezone]>=2.13.4",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "redis>=8.0.1",
    "rich>=15.0.0",
    "sqlalchemy>=2.0.51",
    "structlog>=26.1.0",
    "uvicorn>=0.51.0",
    "webpush>=1.0.6",
    "polars>=1.43.0",
    "fastexcel>=0.20.2",
    "httpx2>=2.9.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.22",
    "pre-commit>=4.6.1",
    "testcontainers>=4.14.2",
    "types-authlib>=1.7.1.20260722",
    "uv-sort>=0.7.1",
    "ty>=0.0.62",
    "import-linter>=2.13",
    # Writing .xlsx, needed only by the schedule-template generator script and
    # the parser tests. The app itself only ever reads spreadsheets (polars +
    # fastexcel), so this stays out of the runtime dependencies.
    "xlsxwriter>=3.2.9",
]

[build-system]
requires = ["uv_build>=0.11.30,<0.12"]
build-backend = "uv_build"

[tool.uv]
# Matches mise.toml, backend/Dockerfile, .claude/setup.sh, and
# .github/workflows/ci.yml; bump all five together.
required-version = "==0.11.30"
# Ignore releases younger than this when resolving, mirroring Renovate's
# `minimumReleaseAge` in renovate.json. Renovate applies the cooldown when it
# *picks* a target version, but when it then calls uv to relock a bumped `>=`
# floor, uv would otherwise resolve to the newest release available — which may
# still be inside the cooldown — and Renovate rejects the lockfile as a pending
# version (the `renovate/artifacts` failure seen on PR #310). Matching the two
# keeps uv's own resolution inside the same window. Keep this in sync with
# renovate.json `minimumReleaseAge`.
exclude-newer = "7 days"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Change both to session-scope so one loop is used for the whole run
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
addopts = ["--strict-markers"]
markers = [
    "integration: tests that use real infrastructure such as PostgreSQL or Redis containers",
    "unit: fast, pure tests with no infrastructure (no DB, Redis, or DI container)",
]
testpaths = ["tests"]
filterwarnings = [
    # Our ORM models map branded NewType columns; SQLAlchemy warns about
    # resolving them implicitly. Tracked separately from the test suite.
    "ignore:Matching the provided NewType",
    # testcontainers' Redis module uses a deprecated wait decorator internally.
    "ignore:The @wait_container_is_ready decorator is deprecated",
]

[tool.coverage.run]
source = ["fanfan"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.uv.build-backend]
module-name = "fanfan"

# Architectural boundary enforcement (run via `just backend-import-lint`).
# Keeps the Clean/Hexagonal layering from docs/backend.md honest: inner layers
# must never import outer ones. See AGENTS.md ("Never") and docs/backend.md.
[tool.importlinter]
root_package = "fanfan"

[[tool.importlinter.contracts]]
name = "core stays pure (no outward imports)"
type = "forbidden"
source_modules = ["fanfan.core"]
forbidden_modules = [
    "fanfan.application",
    "fanfan.adapters",
    "fanfan.presentation",
    "fanfan.main",
]

[[tool.importlinter.contracts]]
name = "application depends only on core (not on adapters/presentation)"
type = "forbidden"
source_modules = ["fanfan.application"]
forbidden_modules = [
    "fanfan.adapters",
    "fanfan.presentation",
    "fanfan.main",
]

[project.scripts]
web = "fanfan.main.web:main"
stream = "fanfan.main.faststream:main"
cli = "fanfan.main.cli:main"
scheduler = "fanfan.main.scheduler:main"
generate-vapid = "fanfan.main.generate_vapid:main"
