# No `exclude`: setting it *replaces* ruff's built-in list instead of extending it,
# so new defaults would stop applying. Use `extend-exclude` if a path needs skipping.

line-length = 88

# `target-version` is unset on purpose: ruff infers it from `requires-python` in the
# pyproject.toml beside this file, keeping the Python version pinned in one place.

[lint]
# `ALL` opts in to rules added by future ruff releases, against ruff's own "use ALL
# with discretion" advice. Deliberate — but it means a ruff bump needs rule triage.
select = ["ALL"]
ignore = [
    "D",       # pydocstyle (noisy in app development where public docs aren't strictly mandated)
    # Exceptions are named for the domain condition they represent (UserNotFound,
    # MailingAlreadyCancelled), which is the convention docs/backend.md documents.
    # PEP 8 asks for the suffix only "if the exception actually is an error", and the
    # semantic markers (NotFound, Conflict, RateLimited) classify a condition rather
    # than being errors. It fires on only a handful of the exception classes anyway —
    # pep8-naming doesn't recurse through subclasses (ruff#783), so acting on it would
    # cascade renames across the whole hierarchy for no semantic gain.
    "N818",    # error-suffix-on-exception-name
    # PLR0904 (too-many-public-methods) stays globally off: it has no natural scope
    # and false-positives on data-access gateways that legitimately grow many query
    # methods. It is also a preview rule, so `ALL` does not select it and the entry
    # below is inert today — it stays so that turning `preview` on cannot surface the
    # rule unannounced. The three function-complexity metrics — return statements,
    # branches, statements — are left ENABLED on purpose: the codebase satisfies all
    # three everywhere today, so an oversized function is a real smell worth catching,
    # and a genuinely branchy interactor documents the exception with an inline `noqa`
    # at the site — the same pattern PLR0913/PLR0917 already use on the
    # framework-injected routers (telemetry.py, the OAuth callback, the notifications
    # consumer). PLR1711 (useless-return) and PLR2004 (magic-value-comparison) stay
    # enabled too; PLR2004 is scoped off only in pluralize.py (per-file-ignores
    # below), whose constants are intrinsic Russian plural-rule numbers, not stray
    # magic values.
    "PLR0904",  # too-many-public-methods
    "COM812",  # missing-trailing-comma (formatter compatibility)
    "ISC001",  # single-line-implicit-string-concatenation (formatter compatibility)
    "ARG001",  # unused-function-argument (standard in web routers / dependency injections)
    "FIX002",  # line-contains-todo (TODOs are valid development indicators, not errors)
    "TD002",   # missing-todo-author (git blame already answers "who")
    # A TODO must explain itself (AGENTS.md), not point at a tracker: this project has
    # no issue-per-TODO workflow, so requiring a link would only buy placeholder refs.
    "TD003",   # missing-todo-link (flake8-todos)

    # ⚠️ CRITICAL: runtime type-hint consumers resolve these annotations at import or
    # serialization time — SQLAlchemy (Mapped[...]), Pydantic, Dishka DI, and the
    # adaptix retorts that (de)serialize plain core dataclasses. Moving the import
    # under TYPE_CHECKING makes the name unresolvable, so `get_type_hints()` raises
    # NameError when the retort/mapper builds. `from __future__ import annotations`
    # does NOT save us: it only defers the failure from import time to first
    # serialization. Verified — TC-fixing core/models/sync_run.py (which already has
    # the future import) breaks the app's adaptix retort with
    # `NameError: name 'UserId' is not defined`. Ruff's runtime-evaluated-base-classes
    # knob can't help either: no cross-file analysis (ruff#7866) for our
    # BaseORM/AppEvent/*Config bases, Dishka constructor injection has no base-class
    # knob, and adaptix dataclasses have no marker base at all. Keep disabled.
    "TC001",  # typing-only-first-party-import
    "TC002",  # typing-only-third-party-import
    "TC003",  # typing-only-standard-library-import

    # Allow Cyrillic characters (Russian language project)
    "RUF001",  # ambiguous-unicode-character-string
    "RUF002",  # ambiguous-unicode-character-docstring
    "RUF003",  # ambiguous-unicode-character-comment

    "CPY001", # missing-copyright-notice — the MIT LICENSE is at the repo root, not per file
]

[lint.flake8-annotations]
# ANN is fully enabled, and the whole group is load-bearing rather than a style
# preference: `ty` does not check an unannotated function at all. It skips the
# body, and it infers nothing for the return, so every caller gets Unknown. A
# missing annotation is therefore how type checking gets switched off for a
# function without touching any config — verified, not assumed.
#
# `*args`/`**kwargs` that exist only to forward to another call are genuinely
# untyped at this layer — ANN401 on them would buy a `object` annotation that
# every caller then has to cast back. Everything else keeps ANN401: an explicit
# `Any` is a checking hole, and it should cost a visible `noqa` with a reason.
allow-star-arg-any = true

[lint.flake8-bugbear]
# Safe list of immutables to prevent false positives when using FastAPI/FastStream DI
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.Header", "faststream.Depends", "pydantic.Field"]

[lint.per-file-ignores]
"src/fanfan/core/utils/pluralize.py" = [
    "PLR2004", # the 1/10/11/20/100 literals are intrinsic Russian plural-rule numbers, not magic values
]
"src/fanfan/main/generate_vapid.py" = [
    "T201",    # standalone keygen CLI — printing the keys/app key to stdout is the point
]
# Repo-level setup scripts (bootstrap.py etc.); not part of the fanfan package.
"scripts/*.py" = [
    "T201",    # setup CLIs print progress/next-steps to stdout — that's the point
]
"tests/**/*.py" = [
    "S101",    # asserts are the assertion mechanism in tests. Production code keeps S101
    #            enabled: asserts vanish under `python -O`, so an invariant or security
    #            check written as an assert would be silently dropped in prod.
    "S105",    # hardcoded passwords in tests are fine
    "S106",    # hardcoded passwords in tests are fine
    "PLR2004", # magic numbers (e.g. status code == 200) are totally fine in tests
    "PLR0913", # a test's arguments are pytest fixtures, not a call signature anyone types
    "SLF001",  # accessing private members during testing is sometimes necessary
]
# Interactors take their collaborators through Dishka constructor injection: one
# parameter per port, assembled by the container. Capping the count would only push
# them into a bundle object and hide the same dependencies (ADR-0005).
"src/fanfan/application/interactors/**/*.py" = [
    "PLR0913", # too-many-arguments
    "PLR0917", # too-many-positional-arguments — same constructors, counted positionally
]
"src/fanfan/adapters/db/migrations/versions/*.py" = [
    "E501",    # Alembic sometimes generates long lines
    "N999",    # filenames are Alembic's `<date>-<revision>_<slug>` template, not module names
]
