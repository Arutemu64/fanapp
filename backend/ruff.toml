# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Same as Black.
line-length = 88
indent-width = 4

# Assume Python 3.14
target-version = "py314"

[lint]
select = ["ALL"]
ignore = [
    "D",       # pydocstyle (noisy in app development where public docs aren't strictly mandated)
    "ANN",     # flake8-annotations (type-checking is handled statically by `ty`)
    "N",       # pep8-naming (occasionally conflicts with external schemas or webhook models)
    "FBT",     # flake8-boolean-trap (perfectly fine for query params/arguments in web routes)
    # pylint-refactor code-metric rules: noisy in DDD interactors/controllers where
    # many arguments and branches are structurally expected. PLR1711 (useless-return)
    # and PLR2004 (magic-value-comparison) both stay enabled; PLR2004 is scoped off
    # only in pluralize.py (per-file-ignores below), whose constants are intrinsic
    # Russian plural-rule numbers, not stray magic values.
    "PLR0904",  # too-many-public-methods
    "PLR0911",  # too-many-return-statements
    "PLR0912",  # too-many-branches
    "PLR0913",  # too-many-arguments
    "PLR0915",  # too-many-statements
    "COM812",  # missing-trailing-comma (formatter compatibility)
    "ISC001",  # single-line-implicit-string-concatenation (formatter compatibility)
    "ARG001",  # unused-function-argument (standard in web routers / dependency injections)
    "FIX002",  # line-contains-todo (TODOs are valid development indicators, not errors)
    "TD002",   # missing-todo-author (git blame already answers "who")
    # A TODO must explain itself (AGENTS.md), not point at a tracker: this project has
    # no issue-per-TODO workflow, so requiring a link would only buy placeholder refs.
    "TD003",   # missing-todo-link (flake8-todos)
    # TD004 (missing colon) stays enabled: it is the mechanical half of the AGENTS.md
    # rule that a TODO explains itself. The colon is what separates the marker from
    # its description, so a bare `# TODO fix this` cannot pass.

    # ⚠️ CRITICAL: Project evaluates annotations at runtime (no `from __future__
    # import annotations`), and SQLAlchemy (Mapped[...]), Pydantic, and Dishka DI
    # all resolve type hints at runtime. Moving these imports under TYPE_CHECKING
    # breaks that. Ruff's runtime-evaluated-base-classes can't save us: it has no
    # cross-file analysis (ruff#7866) — our custom BaseORM/AppEvent/*Config bases
    # live in other modules — and Dishka constructor injection has no base-class
    # knob at all. Keep disabled.
    "TC001",  # typing-only-first-party-import
    "TC002",  # typing-only-third-party-import
    "TC003",  # typing-only-standard-library-import

    # Allow Cyrillic characters (Russian language project)
    "RUF001",  # ambiguous-unicode-character-string
    "RUF002",  # ambiguous-unicode-character-docstring
    "RUF003",  # ambiguous-unicode-character-comment

    "S101",   # assert statements used for invariants; security checks never rely on them
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[lint.flake8-bugbear]
# Safe list of immutables to prevent false positives when using FastAPI/FastStream DI
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.Header", "faststream.Depends", "pydantic.Field"]

[format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"

[lint.per-file-ignores]
"src/fanfan/core/utils/pluralize.py" = [
    "PLR2004", # the 1/10/11/20/100 literals are intrinsic Russian plural-rule numbers, not magic values
]
"src/fanfan/main/generate_vapid.py" = [
    "T201",    # standalone keygen CLI — printing the keys/app key to stdout is the point
]
# Repo-level setup scripts (bootstrap.py etc.); not part of the fanfan package.
"scripts/*.py" = [
    "T201",    # setup CLIs print progress/next-steps to stdout — that's the point
    "INP001",  # standalone scripts, not an importable package
]
"tests/**/*.py" = [
    "S101",    # asserts are standard in tests
    "S105",    # hardcoded passwords in tests are fine
    "S106",    # hardcoded passwords in tests are fine
    "F401",    # unused imports are common in fixtures / conftest files
    "PLR2004", # magic numbers (e.g. status code == 200) are totally fine in tests
    "SLF001",  # accessing private members during testing is sometimes necessary
]
"src/fanfan/adapters/db/migrations/env.py" = [
    "ERA001",  # Alembic auto-generates commented out code
    "INP001",  # Not a package
]
"src/fanfan/adapters/db/migrations/versions/*.py" = [
    "E501",    # Alembic sometimes generates long lines
    "INP001",  # Not a package
]
