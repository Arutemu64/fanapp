line-length = 88

[lint]
preview = true
explicit-preview-rules = true
select = ["ALL", "PLR6301", "PLC2701", "PLR1702"]
ignore = [
    "D",
    "N818",
    "PLR0904",
    "COM812",
    "ISC001",
    "ARG001",
    "FIX002",
    "TD002",
    "TD003",

    "TC001",
    "TC002",
    "TC003",

    "RUF001",
    "RUF002",
    "RUF003",

    "CPY001",
]

[lint.mccabe]
max-complexity = 8

[lint.pylint]
max-nested-blocks = 3

[lint.flake8-annotations]
allow-star-arg-any = true

[lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.Header", "faststream.Depends", "pydantic.Field"]

[lint.per-file-ignores]
"src/fanfan/core/utils/pluralize.py" = [
    "PLR2004",
]
"src/fanfan/main/generate_vapid.py" = [
    "T201",
]
"scripts/*.py" = [
    "T201",
]
"src/fanfan/main/**/*.py" = [
    "PLR6301",
]
"tests/**/*.py" = [
    "PLC2701",
    "PLR6301",
    "S101",
    "S105",
    "S106",
    "PLR2004",
    "PLR0913",
    "SLF001",
]
"src/fanfan/application/interactors/**/*.py" = [
    "PLR0913",
    "PLR0917",
]
"src/fanfan/adapters/db/migrations/versions/*.py" = [
    "E501",
    "N999",
]
