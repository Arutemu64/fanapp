name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
  PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
  PUBLIC_TIMEZONE: ${{ vars.PUBLIC_TIMEZONE }}
  PUBLIC_VAPID_KEY: ${{ vars.PUBLIC_VAPID_KEY }}
  PUBLIC_SENTRY_DSN: ${{ vars.PUBLIC_SENTRY_DSN }}
  PUBLIC_SENTRY_ENVIRONMENT: ${{ vars.PUBLIC_SENTRY_ENVIRONMENT }}
  PUBLIC_SENTRY_TRACES_SAMPLE_RATE: ${{ vars.PUBLIC_SENTRY_TRACES_SAMPLE_RATE }}
  PUBLIC_UMAMI_SCRIPT_URL: ${{ vars.PUBLIC_UMAMI_SCRIPT_URL }}
  PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.PUBLIC_UMAMI_WEBSITE_ID }}
  PUBLIC_VK_GROUP_ID: ${{ vars.PUBLIC_VK_GROUP_ID }}
  PUBLIC_TELEGRAM_BOT_USERNAME: ${{ vars.PUBLIC_TELEGRAM_BOT_USERNAME }}

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      root: ${{ steps.filter.outputs.root }}
      dockerfiles: ${{ steps.filter.outputs.dockerfiles }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'shared/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'shared/**'
              - '.github/workflows/ci.yml'
            root:
              - '**/*.md'
              - '**/*.yml'
              - '**/*.yaml'
              - '.prettierrc'
              - '.prettierignore'
              - '.github/workflows/ci.yml'
            dockerfiles:
              - '**/Dockerfile'
              - '.hadolint.yaml'
              - '.github/workflows/ci.yml'
            workflows:
              - '.github/workflows/**'
              - '.pre-commit-config.yaml'

  backend:
    name: Backend (lint, types, tests)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    env:
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.0"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --all-groups --frozen

      - name: Ruff lint
        if: ${{ !cancelled() }}
        run: uv run ruff check src/fanfan tests scripts --respect-gitignore

      - name: Ruff format check
        if: ${{ !cancelled() }}
        run: uv run ruff format --check src/fanfan tests scripts --respect-gitignore

      - name: Dependency sort check (uv-sort)
        if: ${{ !cancelled() }}
        run: uv run uv-sort --check

      - name: Type check (ty)
        if: ${{ !cancelled() }}
        run: uv run ty check

      - name: Import boundaries (import-linter)
        if: ${{ !cancelled() }}
        run: uv run lint-imports

      - name: Tests
        if: ${{ !cancelled() }}
        run: uv run pytest tests --cov --cov-report=term-missing

      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f .coverage ]; then
            {
              echo "## Backend coverage: $(uv run coverage report --format=total)%"
              echo ""
              echo "<details><summary>Per-file coverage</summary>"
              echo ""
              uv run coverage report --format=markdown
              echo ""
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  frontend:
    name: Frontend (lint, types, tests)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12.10.1

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (prettier, eslint)
        if: ${{ !cancelled() }}
        run: pnpm lint

      - name: Type check (svelte-check)
        if: ${{ !cancelled() }}
        run: pnpm check

      - name: Unit tests (vitest)
        if: ${{ !cancelled() }}
        run: pnpm test

      - name: API client drift
        if: ${{ !cancelled() }}
        run: pnpm generate-api:check

  frontend-e2e:
    name: Frontend (e2e)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12.10.1

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check the e2e suite
        run: pnpm e2e:typecheck

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps --only-shell chromium webkit

      - name: Run E2E tests
        run: pnpm e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  root:
    name: Markdown and YAML (prettier)
    needs: changes
    if: needs.changes.outputs.root == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12.10.1

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Check formatting (prettier)
        run: frontend/node_modules/.bin/prettier --check "**/*.{md,yml,yaml}"

  dockerfiles:
    name: Dockerfiles (hadolint)
    needs: changes
    if: needs.changes.outputs.dockerfiles == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Lint Dockerfiles
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          recursive: true

  images:
    name: Images (${{ matrix.name }} build)
    needs: changes
    if: |
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.dockerfiles == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            target: ""
          - name: frontend
            context: ./frontend
            target: prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        continue-on-error: true
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: false
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}-${{ matrix.name }}:buildcache

  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks

      - name: Scan for secrets
        run: gitleaks dir . --redact --no-banner

  workflows:
    name: Workflows (actionlint, zizmor)
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Lint workflows (actionlint)
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

      - name: Audit workflows (zizmor)
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          inputs: .github/workflows/ .pre-commit-config.yaml
          advanced-security: false
          annotations: true
          online-audits: false

  ci-ok:
    name: CI success
    if: always()
    needs: [changes, backend, frontend, root, dockerfiles, images, secrets, workflows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail if any required job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
