name: CI

# Run the same quality gates we run locally (see justfile / .pre-commit-config.yaml)
# on every pull request and on pushes to main.
#
# Split into one job per area (backend, frontend, dockerfiles) plus a
# `changes` job that gates them, so each area reports its own red/green check
# and branch protection can require them individually — a docs-only PR then
# shows backend/frontend as skipped instead of buried inside one job's log.
# Frontend further fans out into a lint/check/test/build matrix so those
# independent tasks run in parallel: wall-clock time drops to the slowest
# single task instead of their sum.
#
# Run the identical gates locally with `just ci` before pushing.
on:
  pull_request:
  push:
    branches: [main]

# If new commits are pushed to the same branch/PR while a run is in progress,
# cancel the older run so we only spend CI minutes on the latest code.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# dorny/paths-filter reads changed files via the GitHub API on pull_request
# events; without these read scopes the default GITHUB_TOKEN gets
# "Resource not accessible by integration".
permissions:
  contents: read
  pull-requests: read

jobs:
  # Detect which areas changed so we skip gates for unrelated edits (e.g.
  # docs, AGENTS.md) — a docs-only change then costs a single metered minute.
  # Downstream jobs gate on these outputs. The workflow file is in every
  # filter so changes to CI always re-run everything.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      dockerfiles: ${{ steps.filter.outputs.dockerfiles }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'shared/**'
              - '.github/workflows/ci.yml'
            dockerfiles:
              - '**/Dockerfile'
              - '.hadolint.yaml'
              - '.github/workflows/ci.yml'

  backend:
    name: Backend (lint, types, tests)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    # Docker is preinstalled and running on ubuntu-latest, which is all the
    # testcontainers-based integration tests (Postgres + Redis) need.
    defaults:
      run:
        working-directory: backend
    env:
      # CI runners can block the testcontainers Ryuk reaper's socket; the
      # ephemeral VM is thrown away after the job, so cleanup isn't needed.
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.29"  # matches backend/pyproject.toml [tool.uv] and Dockerfile
          enable-cache: true
          # Cache invalidates when the backend lockfile changes.
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --all-groups --frozen

      # Every gate below is guarded with `!cancelled()` so the rest keep running
      # after one fails: a single run then reports every problem instead of only
      # the first, matching `fail-fast: false` on the frontend matrix below.
      #
      # Lint and format are check-only here (no --fix / no rewrite): CI must
      # fail on violations, not silently "fix" them like the local justfile does.
      - name: Ruff lint
        if: ${{ !cancelled() }}
        run: uv run ruff check src/fanfan tests --respect-gitignore

      - name: Ruff format check
        if: ${{ !cancelled() }}
        run: uv run ruff format --check src/fanfan tests --respect-gitignore

      - name: Type check (ty)
        if: ${{ !cancelled() }}
        run: uv run ty check src/fanfan

      # Runs unit and integration tests. Integration tests start their own
      # Postgres/Redis containers via testcontainers fixtures.
      - name: Tests
        if: ${{ !cancelled() }}
        run: uv run pytest tests

  frontend:
    # Lint, check, test and build are independent, so we run them as a matrix
    # of parallel jobs instead of sequential steps. Wall-clock time drops to
    # the slowest single task (the build) instead of the sum of all four.
    name: Frontend (${{ matrix.task.name }})
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    # `check` and `build` read PUBLIC_* via `$env/static/public`, which errors on
    # any referenced var that is undefined at build time. Supply them from the
    # same repository variables the publish workflow bakes in (empty is fine — the
    # vars just need to exist). `lint` and `test` ignore them.
    env:
      PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
      PUBLIC_APP_VERSION: ${{ vars.PUBLIC_APP_VERSION }}
      PUBLIC_VAPID_KEY: ${{ vars.PUBLIC_VAPID_KEY }}
      PUBLIC_SENTRY_DSN: ${{ vars.PUBLIC_SENTRY_DSN }}
      PUBLIC_SENTRY_ENVIRONMENT: ${{ vars.PUBLIC_SENTRY_ENVIRONMENT }}
      PUBLIC_SENTRY_TRACES_SAMPLE_RATE: ${{ vars.PUBLIC_SENTRY_TRACES_SAMPLE_RATE }}
      PUBLIC_SMARTCAPTCHA_CLIENT_KEY: ${{ vars.PUBLIC_SMARTCAPTCHA_CLIENT_KEY }}
    strategy:
      # Don't cancel the other tasks when one fails: we want to see every
      # failure (lint, types, tests and build) in a single CI run, not just the first.
      fail-fast: false
      matrix:
        task:
          - { name: lint, command: pnpm lint }
          - { name: check, command: pnpm check }
          - { name: test, command: pnpm test }
          - { name: build, command: pnpm build }
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          # Explicit version, kept in sync with mise.toml and
          # frontend/package.json "packageManager" by the Renovate "pnpm" group
          # (docs/dependencies.md). We can't omit it and read packageManager
          # instead: v6 fails to resolve it from a subdirectory package.json
          # (pnpm/action-setup#227), and there is no root package.json here.
          version: 11.15.1

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ${{ matrix.task.name }}
        run: ${{ matrix.task.command }}

  dockerfiles:
    name: Dockerfiles (hadolint)
    needs: changes
    if: needs.changes.outputs.dockerfiles == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      # Lint the Dockerfiles against best practices with hadolint. `recursive`
      # scans every Dockerfile from the repo root, so new ones are covered without
      # touching this workflow. Reads .hadolint.yaml (trusted registries) by default.
      - name: Lint Dockerfiles
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          recursive: true
