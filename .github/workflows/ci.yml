name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
  PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
  PUBLIC_TIMEZONE: ${{ vars.PUBLIC_TIMEZONE }}
  PUBLIC_VAPID_KEY: ${{ vars.PUBLIC_VAPID_KEY }}
  PUBLIC_SENTRY_DSN: ${{ vars.PUBLIC_SENTRY_DSN }}
  PUBLIC_SENTRY_ENVIRONMENT: ${{ vars.PUBLIC_SENTRY_ENVIRONMENT }}
  PUBLIC_SENTRY_TRACES_SAMPLE_RATE: ${{ vars.PUBLIC_SENTRY_TRACES_SAMPLE_RATE }}
  PUBLIC_UMAMI_SCRIPT_URL: ${{ vars.PUBLIC_UMAMI_SCRIPT_URL }}
  PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.PUBLIC_UMAMI_WEBSITE_ID }}
  PUBLIC_VK_GROUP_ID: ${{ vars.PUBLIC_VK_GROUP_ID }}
  PUBLIC_TELEGRAM_BOT_USERNAME: ${{ vars.PUBLIC_TELEGRAM_BOT_USERNAME }}

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      root: ${{ steps.filter.outputs.root }}
      dockerfiles: ${{ steps.filter.outputs.dockerfiles }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'shared/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'shared/**'
              - '.github/workflows/ci.yml'
            root:
              - '**/*.md'
              - '**/*.yml'
              - '**/*.yaml'
              - '.prettierrc'
              - '.prettierignore'
              - 'justfile'
              - 'mise.toml'
              - '.github/workflows/ci.yml'
            dockerfiles:
              - '**/Dockerfile'
              - '.hadolint.yaml'
              - '.github/workflows/ci.yml'
            workflows:
              - '.github/workflows/**'
              - '.pre-commit-config.yaml'

  backend:
    name: Backend (lint, types, tests)
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    env:
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        # zizmor: ignore[cache-poisoning] Test-only cache; publishing rebuilds in Docker without this cache.
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.0"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --all-groups --locked

      - name: Ruff lint
        if: ${{ !cancelled() }}
        run: uv run --locked ruff check src/fanfan tests scripts --respect-gitignore

      - name: Ruff format check
        if: ${{ !cancelled() }}
        run: uv run --locked ruff format --check src/fanfan tests scripts --respect-gitignore

      - name: Dependency sort check (uv-sort)
        if: ${{ !cancelled() }}
        run: uv run --locked uv-sort --check

      - name: Type check (ty)
        if: ${{ !cancelled() }}
        run: uv run --locked ty check

      - name: Import boundaries (import-linter)
        if: ${{ !cancelled() }}
        run: uv run --locked lint-imports

      - name: Tests
        if: ${{ !cancelled() }}
        run: uv run --locked pytest tests --cov --cov-report=term-missing

      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f .coverage ]; then
            {
              echo "## Backend coverage: $(uv run --locked coverage report --format=total)%"
              echo ""
              echo "<details><summary>Per-file coverage</summary>"
              echo ""
              uv run --locked coverage report --format=markdown
              echo ""
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  frontend:
    name: Frontend (lint, types, tests)
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.15.0

      - name: Install Node
        # zizmor: ignore[cache-poisoning] Test-only cache; publishing rebuilds in Docker without this cache.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (prettier, eslint)
        if: ${{ !cancelled() }}
        run: pnpm lint

      - name: Type check (svelte-check)
        if: ${{ !cancelled() }}
        run: pnpm check

      - name: Unit tests (vitest)
        if: ${{ !cancelled() }}
        run: pnpm test

      - name: API client drift
        if: ${{ !cancelled() }}
        run: pnpm generate-api:check

  frontend-e2e:
    name: Frontend (e2e)
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.15.0

      - name: Install Node
        # zizmor: ignore[cache-poisoning] Test-only cache; publishing rebuilds in Docker without this cache.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check the e2e suite
        run: pnpm e2e:typecheck

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps --only-shell chromium webkit

      - name: Run E2E tests
        run: pnpm e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  root:
    name: Root files (prettier, just)
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.root == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.15.0

      - name: Install Node
        # zizmor: ignore[cache-poisoning] Test-only cache; publishing rebuilds in Docker without this cache.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install pinned Just
        run: |
          just_version="$(python3 -c 'import tomllib; print(tomllib.load(open("mise.toml", "rb"))["tools"]["just"])')"
          just_archive="just-${just_version}-x86_64-unknown-linux-musl.tar.gz"
          just_url="https://github.com/casey/just/releases/download/${just_version}"
          just_dir="$(mktemp -d)"
          cd "$just_dir"
          curl --fail --silent --show-error --location "$just_url/$just_archive" --output "$just_archive"
          curl --fail --silent --show-error --location "$just_url/SHA256SUMS" --output SHA256SUMS
          sha256sum --check --ignore-missing SHA256SUMS
          tar -xzf "$just_archive" just
          echo "$just_dir" >> "$GITHUB_PATH"

      - name: Check Just formatting and syntax
        run: just --fmt --check

      - name: Check formatting (prettier)
        run: frontend/node_modules/.bin/prettier --check "**/*.{md,yml,yaml}"

  dockerfiles:
    name: Dockerfiles (hadolint)
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.dockerfiles == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint Dockerfiles
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          recursive: true

  images:
    name: Images (${{ matrix.name }} build)
    needs: changes
    if: |
      github.event_name != 'pull_request' ||
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.dockerfiles == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            target: ""
          - name: frontend
            context: ./frontend
            target: prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        continue-on-error: true
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase cache ref
        id: cache
        env:
          IMAGE: ghcr.io/${{ github.repository }}-${{ matrix.name }}
        run: echo "ref=${IMAGE,,}:buildcache" >> "$GITHUB_OUTPUT"

      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: false
          cache-from: type=registry,ref=${{ steps.cache.outputs.ref }}

  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks

      - name: Scan for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          range="$HEAD_SHA"
          if [ -n "$BASE_SHA" ]; then
            range="$BASE_SHA..$HEAD_SHA"
          fi
          gitleaks git . --log-opts="$range" --redact --no-banner

  workflows:
    name: Workflows (actionlint, zizmor)
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint workflows (actionlint)
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

      - name: Audit workflows (zizmor)
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          inputs: .github/workflows/ .pre-commit-config.yaml
          advanced-security: false
          annotations: true
          online-audits: false

  ci-ok:
    name: CI success
    if: always()
    needs: [changes, backend, frontend, frontend-e2e, root, dockerfiles, images, secrets, workflows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail if any required job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1

  publish:
    needs: ci-ok
    if: github.event_name != 'pull_request'
    name: Build and push (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      REGISTRY: ghcr.io
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            image: ${{ github.repository }}-backend
            target: ""
          - name: frontend
            context: ./frontend
            image: ${{ github.repository }}-frontend
            target: prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image ref
        id: image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ matrix.image }}
        run: echo "ref=${IMAGE,,}" >> "$GITHUB_OUTPUT"

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          tags: |
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Read release version
        id: version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("backend/pyproject.toml", "rb"))["project"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ${{ matrix.name == 'frontend' && format('PUBLIC_API_URL={0}', vars.PUBLIC_API_URL) || '' }}
            ${{ matrix.name == 'frontend' && format('PUBLIC_SITE_URL={0}', vars.PUBLIC_SITE_URL) || '' }}
            ${{ matrix.name == 'frontend' && format('PUBLIC_TIMEZONE={0}', vars.PUBLIC_TIMEZONE) || '' }}
            ${{ matrix.name == 'frontend' && format('PUBLIC_VAPID_KEY={0}', vars.PUBLIC_VAPID_KEY) || '' }}
            ${{ matrix.name == 'frontend' && format('PUBLIC_SENTRY_DSN={0}', vars.PUBLIC_SENTRY_DSN) || '' }}
            ${{ matrix.name == 'frontend' && format('PUBLIC_SENTRY_ENVIRONMENT={0}', vars.PUBLIC_SENTRY_ENVIRONMENT) || '' }}
            ${{ matrix.name == 'frontend' && format('PUBLIC_SENTRY_TRACES_SAMPLE_RATE={0}', vars.PUBLIC_SENTRY_TRACES_SAMPLE_RATE) || '' }}
            ${{ matrix.name == 'frontend' && format('PUBLIC_UMAMI_SCRIPT_URL={0}', vars.PUBLIC_UMAMI_SCRIPT_URL) || '' }}
            ${{ matrix.name == 'frontend' && format('PUBLIC_UMAMI_WEBSITE_ID={0}', vars.PUBLIC_UMAMI_WEBSITE_ID) || '' }}
            ${{ matrix.name == 'frontend' && format('PUBLIC_VK_GROUP_ID={0}', vars.PUBLIC_VK_GROUP_ID) || '' }}
            ${{ matrix.name == 'frontend' && format('PUBLIC_TELEGRAM_BOT_USERNAME={0}', vars.PUBLIC_TELEGRAM_BOT_USERNAME) || '' }}
            ${{ matrix.name == 'frontend' && format('SENTRY_URL={0}', vars.SENTRY_URL) || '' }}
            ${{ matrix.name == 'frontend' && format('SENTRY_ORG={0}', vars.SENTRY_ORG) || '' }}
            ${{ matrix.name == 'frontend' && format('SENTRY_PROJECT={0}', vars.SENTRY_PROJECT) || '' }}
            ${{ matrix.name == 'frontend' && format('APP_VERSION={0}', steps.version.outputs.version) || '' }}
            APP_BUILD=${{ github.sha }}
          secrets: |
            ${{ matrix.name == 'frontend' && format('sentry_auth_token={0}', secrets.SENTRY_AUTH_TOKEN) || '' }}
          cache-from: type=registry,ref=${{ steps.image.outputs.ref }}:buildcache
          cache-to: type=registry,ref=${{ steps.image.outputs.ref }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
