name: CI

# Run the same quality gates we run locally (see justfile / .pre-commit-config.yaml)
# on every pull request and on pushes to main.
#
# Split into one job per area (backend, frontend, frontend-e2e, dockerfiles,
# images, secrets, workflows) plus a `changes` job that gates them, so each area
# reports its own red/green check and branch protection can require them
# individually — a docs-only PR then shows backend/frontend as skipped instead
# of buried inside one job's log.
# Frontend further fans out into a lint/check/test/build matrix so those
# independent tasks run in parallel: wall-clock time drops to the slowest
# single task instead of their sum.
#
# This workflow is the single source of truth for what "green" means. There is
# deliberately NO aggregate `just ci` recipe mirroring it: a second copy of the
# gate list is a second thing to forget to update, and the copy that rots is
# always the local one. Run the individual recipes (`just backend-lint`,
# `just frontend-lint`, …) while you work; let this file decide when it's done.
#
# Runner hardening applied to every job below (2026 supply-chain practice):
#   - runs-on is pinned to ubuntu-24.04, not the floating `ubuntu-latest`
#     label GitHub migrates without notice. Pinning also brings the runner
#     under Renovate: its github-actions manager bumps a pinned `ubuntu-24.04`
#     via the github-runners datasource (it ignores the `ubuntu-latest`
#     variable), so the next stable image (e.g. 26.04) arrives as a review PR.
#   - step-security/harden-runner runs first in egress-policy: audit — it only
#     records outbound network calls (never blocks), so a compromised action or
#     dependency surfaces in the run's network log.
#   - checkout uses persist-credentials: false so the GITHUB_TOKEN is not left
#     in .git/config for a later step to read — safe here because no job pushes
#     with git (the images job builds only; publishing lives in its own workflow).
#   - timeout-minutes caps each job so a hung test or build can't hold a runner
#     for the 6-hour default.
on:
  pull_request:
  push:
    branches: [main]

# If new commits are pushed to the same branch/PR while a run is in progress,
# cancel the older run so we only spend CI minutes on the latest code.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# dorny/paths-filter reads changed files via the GitHub API on pull_request
# events; without these read scopes the default GITHUB_TOKEN gets
# "Resource not accessible by integration".
permissions:
  contents: read
  pull-requests: read

jobs:
  # Detect which areas changed so we skip gates for unrelated edits (e.g.
  # docs, AGENTS.md) — a docs-only change then costs a single metered minute.
  # Downstream jobs gate on these outputs. The workflow file is in every
  # filter so changes to CI always re-run everything.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      dockerfiles: ${{ steps.filter.outputs.dockerfiles }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              # The backend suite owns the OpenAPI drift test, so a hand-edited
              # spec (or a bad merge resolution) has to re-run it.
              - 'shared/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'shared/**'
              - '.github/workflows/ci.yml'
            dockerfiles:
              - '**/Dockerfile'
              - '.hadolint.yaml'
              - '.github/workflows/ci.yml'
            # Every workflow, not just this one: the linters below audit them
            # all. `.pre-commit-config.yaml` is in the list because zizmor is
            # pointed at it too, so editing it has to re-run its only audit.
            workflows:
              - '.github/workflows/**'
              - '.pre-commit-config.yaml'

  backend:
    name: Backend (lint, types, tests)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # Docker is preinstalled and running on ubuntu-24.04, which is all the
    # testcontainers-based integration tests (Postgres + Redis) need.
    defaults:
      run:
        working-directory: backend
    env:
      # CI runners can block the testcontainers Ryuk reaper's socket; the
      # ephemeral VM is thrown away after the job, so cleanup isn't needed.
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.3"  # matches backend/pyproject.toml [tool.uv] and Dockerfile
          enable-cache: true
          # Cache invalidates when the backend lockfile changes.
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --all-groups --frozen

      # Every gate below is guarded with `!cancelled()` so the rest keep running
      # after one fails: a single run then reports every problem instead of only
      # the first, matching `fail-fast: false` on the frontend matrix below.
      #
      # Lint and format are check-only here (no --fix / no rewrite): CI must
      # fail on violations, not silently "fix" them like the local justfile does.
      - name: Ruff lint
        if: ${{ !cancelled() }}
        run: uv run ruff check src/fanfan tests scripts --respect-gitignore

      - name: Ruff format check
        if: ${{ !cancelled() }}
        run: uv run ruff format --check src/fanfan tests scripts --respect-gitignore

      # --check only: fail if pyproject.toml's dependency tables aren't sorted,
      # never rewrite them here (same check-only stance as ruff above).
      - name: Dependency sort check (uv-sort)
        if: ${{ !cancelled() }}
        run: uv run uv-sort --check

      - name: Type check (ty)
        if: ${{ !cancelled() }}
        run: uv run ty check src/fanfan

      # AGENTS.md's first "Never" — core/ and application/ must not import
      # outward — is a machine-checkable contract ([tool.importlinter] in
      # pyproject.toml), but nothing ran it on a PR: it lived only in
      # `just backend-lint`, so the boundary held only when someone remembered.
      - name: Import boundaries (import-linter)
        if: ${{ !cancelled() }}
        run: uv run lint-imports

      # Runs unit and integration tests under coverage. Integration tests start
      # their own Postgres/Redis containers via testcontainers fixtures.
      # Coverage is measured over the whole run on purpose: interactor behavior
      # lives in the integration tests (docs/testing.md), so a unit-only number
      # would report the entire application layer as uncovered. Config is
      # [tool.coverage.*] in backend/pyproject.toml.
      - name: Tests
        if: ${{ !cancelled() }}
        run: uv run pytest tests --cov --cov-report=term-missing

      # Self-contained coverage reporting: no third-party upload, no token —
      # pytest-cov's `.coverage` data file is rendered straight into this run's
      # job summary via coverage.py's own markdown/total formats. `!cancelled()`
      # so it still posts when an earlier gate failed but the tests ran; the
      # file guard skips it when collection failed before any data was written.
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f .coverage ]; then
            {
              echo "## Backend coverage: $(uv run coverage report --format=total)%"
              echo ""
              echo "<details><summary>Per-file coverage</summary>"
              echo ""
              uv run coverage report --format=markdown
              echo ""
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  frontend:
    # Lint, check, test and build are independent, so we run them as a matrix
    # of parallel jobs instead of sequential steps. Wall-clock time drops to
    # the slowest single task (the build) instead of the sum of all four.
    name: Frontend (${{ matrix.task.name }})
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # `check`, `build` and `test` read PUBLIC_* via `$env/static/public`, which
    # errors on any referenced var that is undefined at build time (`test` pulls
    # PUBLIC_TIMEZONE in through the formatters it covers). Supply them from the
    # same repository variables the publish workflow bakes in (empty is fine — the
    # vars just need to exist). `lint` ignores them.
    env:
      PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
      PUBLIC_APP_VERSION: ${{ vars.PUBLIC_APP_VERSION }}
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
      PUBLIC_TIMEZONE: ${{ vars.PUBLIC_TIMEZONE }}
      PUBLIC_VAPID_KEY: ${{ vars.PUBLIC_VAPID_KEY }}
      PUBLIC_SENTRY_DSN: ${{ vars.PUBLIC_SENTRY_DSN }}
      PUBLIC_SENTRY_ENVIRONMENT: ${{ vars.PUBLIC_SENTRY_ENVIRONMENT }}
      PUBLIC_SENTRY_TRACES_SAMPLE_RATE: ${{ vars.PUBLIC_SENTRY_TRACES_SAMPLE_RATE }}
      PUBLIC_SMARTCAPTCHA_CLIENT_KEY: ${{ vars.PUBLIC_SMARTCAPTCHA_CLIENT_KEY }}
      PUBLIC_VK_GROUP_ID: ${{ vars.PUBLIC_VK_GROUP_ID }}
    strategy:
      # Don't cancel the other tasks when one fails: we want to see every
      # failure (lint, types, tests and build) in a single CI run, not just the first.
      fail-fast: false
      matrix:
        task:
          - { name: lint, command: pnpm lint }
          - { name: check, command: pnpm check }
          - { name: test, command: pnpm test }
          # Regenerates the API types in memory and fails if the committed
          # schema.d.ts differs — a stale one still typechecks, so `check`
          # above cannot see it.
          - { name: api, command: pnpm generate-api:check }
          - { name: build, command: pnpm build }
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          # Explicit version, kept in sync with mise.toml and
          # frontend/package.json "packageManager" by the Renovate "pnpm" group
          # (docs/dependencies.md). We can't omit it and read packageManager
          # instead: v6 fails to resolve it from a subdirectory package.json
          # (pnpm/action-setup#227), and there is no root package.json here.
          version: 12.3.4

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.20.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ${{ matrix.task.name }}
        run: ${{ matrix.task.command }}

  # Playwright E2E: drives a production build in a real browser with the backend
  # mocked per test (frontend/e2e/README.md). Its own job, not a frontend-matrix
  # task, because unlike the plain `pnpm <task>` matrix it needs a browser binary
  # + system libs and builds the app to preview it. Mocked-only, so it stays gated
  # on the frontend filter (the frontend↔backend contract is guarded separately by
  # the `api`/`check` matrix tasks). Not marked required in branch protection yet —
  # let a browser tier prove stable under CI timing first, then gate it.
  frontend-e2e:
    name: Frontend (e2e)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    # The build reads PUBLIC_* via `$env/static/public`, which errors on any
    # referenced-but-undefined var — supply the same repository variables the
    # frontend matrix and publish workflow use (empty is fine; the names just
    # have to exist).
    env:
      PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
      PUBLIC_APP_VERSION: ${{ vars.PUBLIC_APP_VERSION }}
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
      PUBLIC_TIMEZONE: ${{ vars.PUBLIC_TIMEZONE }}
      PUBLIC_VAPID_KEY: ${{ vars.PUBLIC_VAPID_KEY }}
      PUBLIC_SENTRY_DSN: ${{ vars.PUBLIC_SENTRY_DSN }}
      PUBLIC_SENTRY_ENVIRONMENT: ${{ vars.PUBLIC_SENTRY_ENVIRONMENT }}
      PUBLIC_SENTRY_TRACES_SAMPLE_RATE: ${{ vars.PUBLIC_SENTRY_TRACES_SAMPLE_RATE }}
      PUBLIC_SMARTCAPTCHA_CLIENT_KEY: ${{ vars.PUBLIC_SMARTCAPTCHA_CLIENT_KEY }}
      PUBLIC_VK_GROUP_ID: ${{ vars.PUBLIC_VK_GROUP_ID }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12.3.4

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.20.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The suite has its own tsconfig (e2e/tsconfig.json, pointed at by
      # playwright.config.ts), so `pnpm check` — which types the SvelteKit app —
      # never sees these files, and Playwright transpiles without typing them.
      # Runs before the browser download so a type error fails in seconds.
      - name: Type check the e2e suite
        run: pnpm e2e:typecheck

      # Cache the browser keyed on the resolved Playwright version — it only changes
      # when @playwright/test is bumped, so this is the tightest key that still busts
      # on a bump. PLAYWRIGHT_BROWSERS_PATH is unset on the runner (unlike the Claude
      # web env), so Playwright installs to ~/.cache/ms-playwright.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # --with-deps installs the OS libraries the browsers need on a clean runner.
      # WebKit gives iOS-Safari coverage for this mobile-first app (the config gates
      # its `mobile-webkit` project on CI, since the pre-baked env ships only
      # Chromium). On a cache hit the browsers are already present; the (fast) apt
      # step still runs so a cached browser never lacks its system deps.
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      # `pnpm e2e` builds the app and serves it with `vite preview` via the config's
      # webServer, then runs the suite (retries: 2 on CI).
      - name: Run E2E tests
        run: pnpm e2e

      # The HTML reporter embeds traces (trace: on-first-retry), so this one
      # artifact is enough to debug a red run.
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  dockerfiles:
    name: Dockerfiles (hadolint)
    needs: changes
    if: needs.changes.outputs.dockerfiles == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Lint the Dockerfiles against best practices with hadolint. `recursive`
      # scans every Dockerfile from the repo root, so new ones are covered without
      # touching this workflow. Reads .hadolint.yaml (trusted registries) by default.
      - name: Lint Dockerfiles
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          recursive: true

  # Prove both images still build. hadolint above only parses the Dockerfiles,
  # and until this job existed the only real build ran in docker-publish.yml
  # *after* merge — so anything that breaks a build turned main's publish red
  # instead of the PR that caused it, leaving main unable to ship. That is how
  # PR #360 landed: it bumped four of the five uv pin sites, and the fifth (the
  # builder image tag in backend/Dockerfile) only failed once `uv sync --locked`
  # ran against a uv that no longer matched pyproject's `required-version`.
  #
  # Gated on all three filters because the inputs are wider than the Dockerfiles:
  # backend/uv.lock and backend/pyproject.toml decide whether `uv sync --locked`
  # succeeds, and frontend/pnpm-lock.yaml does the same for the build stage.
  images:
    name: Images (${{ matrix.name }} build)
    needs: changes
    if: |
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.dockerfiles == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Overrides the workflow-level permissions for this job only (the others keep
    # pull-requests: read for paths-filter). packages: read lets the GHCR
    # `:buildcache` pull authenticate once the image packages go private; while
    # they are public it is unused (anonymous pull already works), so this needs
    # no follow-up when the repo's visibility changes.
    permissions:
      contents: read
      packages: read
    strategy:
      # One failing image shouldn't hide the state of the other.
      fail-fast: false
      # Mirrors the matrix in docker-publish.yml — same contexts, same targets.
      matrix:
        include:
          - name: backend
            context: ./backend
            target: ''
          - name: frontend
            context: ./frontend
            target: prod
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      # Best-effort login so the GHCR cache read below authenticates once the
      # image packages are private. continue-on-error because a missing cache is
      # a cold build, never a failure: a fork PR gets a read-only token that
      # cannot authenticate here, and it must not fail the job — the build just
      # runs without the cache (public packages are readable anonymously anyway).
      - name: Log in to GHCR
        continue-on-error: true
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No build-args: they only decide what gets baked into the bundle, not
      # whether the build succeeds, and the publish workflow supplies the real
      # values. `push: false` — this job only proves the build, so it needs no
      # packages: write (the login above is read-only, for the cache).
      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: false
          # Read the GHCR layer cache docker-publish.yml writes on main (a PR
          # branch reads its base branch's cache). Deliberately no cache-to: a
          # PR build must not overwrite main's `:buildcache` tag. Matches the
          # ref the publish workflow writes: ghcr.io/<owner>/<repo>-<name>.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}-${{ matrix.name }}:buildcache

  # Secret scanning as a merge gate. The pre-commit gitleaks hook is the fast
  # local pass, but it sees only staged content and `--no-verify` skips it
  # outright, so the authoritative scan belongs here. Ungated by paths-filter on
  # purpose: a secret can be added in any file, including a docs-only PR.
  #
  # `gitleaks dir` scans the checked-out tree rather than git history — no
  # base/head commit-range logic to get wrong, and it answers the question that
  # decides the merge ("is a secret in the code we are about to ship?") instead
  # of "was one ever committed". Both entry points read .gitleaks.toml from the
  # repo root, so the local and CI scopes cannot drift apart.
  #
  # Installed as a binary rather than via gitleaks/gitleaks-action: that action
  # runs on the deprecated Node 20 runtime and stops working entirely on
  # 2026-09-16, and it requires a paid licence for organisation-owned repos.
  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Keep in sync with the gitleaks `rev` in .pre-commit-config.yaml; Renovate
      # bumps both together via the "gitleaks" group (docs/dependencies.md).
      GITLEAKS_VERSION: 8.30.1
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks

      # --redact so a real hit names the rule and location without printing the
      # secret itself into a public build log.
      - name: Scan for secrets
        run: gitleaks dir . --redact --no-banner

  # Lint the workflows themselves. This file already carries a lot of hand-rolled
  # hardening (SHA-pinned actions, persist-credentials: false, least-privilege
  # permissions, job timeouts) that nothing enforced on the NEXT workflow anyone
  # writes. actionlint covers correctness (expression typos, bad `uses:` refs,
  # shellcheck over `run:` blocks); zizmor covers security (template injection,
  # over-broad permissions, mutable action refs). They overlap barely, which is
  # why both run rather than picking one.
  workflows:
    name: Workflows (actionlint, zizmor)
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Lint workflows (actionlint)
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

      # advanced-security: false keeps this a self-contained pass/fail gate. The
      # default uploads SARIF to the Security tab, which needs code scanning
      # enabled plus security-events: write, and *reports* findings rather than
      # failing the job. With it off, a finding fails the build and
      # annotations: true puts it inline on the PR diff.
      #
      # online-audits: false because those audits hit the GitHub API once per
      # action ref — useful checks, but a network dependency and a rate limit on
      # a merge gate. Enable deliberately if the extra supply-chain audits are
      # wanted. A deliberate exception is suppressed inline in claude.yml.
      - name: Audit workflows (zizmor)
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          # Our own workflows plus the pre-commit config (zizmor audits that
          # too). NOT the action's default `.`, which walks the whole tree and
          # picks up vendored `.github/workflows` inside `.agents/skills/*` —
          # upstream files we neither own nor can fix, since `npx skills`
          # rewrites them on the next sync. Same boundary .pre-commit-config.yaml
          # and .gitleaks.toml already draw around vendored agent content, and it
          # matches the `workflows` paths filter that gates this job.
          inputs: .github/workflows/ .pre-commit-config.yaml
          advanced-security: false
          annotations: true
          online-audits: false

  # Single always-run gate that branch protection requires INSTEAD of the
  # conditional/matrix jobs above. Two reasons the individual jobs can't be
  # required directly:
  #   - A skipped matrix job (area not changed) reports one check under the
  #     un-interpolated name `Frontend (${{ matrix.task.name }})` /
  #     `Images (${{ matrix.name }} build)`, not the expanded `Frontend (lint)`
  #     … contexts. Requiring the expanded names would leave a PR outside that
  #     area waiting forever on a context that never reports.
  #   - If `changes` itself fails, its dependents skip, and a skipped required
  #     check counts as satisfied — a PR could merge with no validation.
  # This job `needs` every gating job and, via `if: always()`, runs even when
  # they skip; it fails iff any need failed or was cancelled (`skipped` and
  # `success` both pass). A failed `changes` therefore fails this gate, closing
  # the bypass. Require exactly this check (name: "CI success") plus the PR-title
  # check in the ruleset. frontend-e2e is deliberately excluded — not a required
  # tier yet (see its job comment) — so it must not gate merges through here.
  #
  # The `needs` list is the one thing to maintain: a new gating job that isn't
  # added here is silently ungated, since the ruleset only requires this gate.
  # Add every new required job to the list (and leave advisory/unstable ones out).
  ci-ok:
    name: CI success
    if: always()
    needs: [changes, backend, frontend, dockerfiles, images, secrets, workflows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Fail if any required job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
