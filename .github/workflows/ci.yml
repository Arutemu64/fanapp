name: CI

# Run the same quality gates we run locally (see justfile / .pre-commit-config.yaml)
# on every pull request and on pushes to main.
#
# Split into one job per area (backend, frontend, dockerfiles, images) plus a
# `changes` job that gates them, so each area reports its own red/green check
# and branch protection can require them individually — a docs-only PR then
# shows backend/frontend as skipped instead of buried inside one job's log.
# Frontend further fans out into a lint/check/test/build matrix so those
# independent tasks run in parallel: wall-clock time drops to the slowest
# single task instead of their sum.
#
# Run the identical gates locally with `just ci` before pushing — except the
# `images` job, which needs a Docker daemon (`just run-prod` builds the same
# two images locally).
#
# Runner hardening applied to every job below (2026 supply-chain practice):
#   - runs-on is pinned to ubuntu-24.04, not the floating `ubuntu-latest`
#     label GitHub migrates without notice. Pinning also brings the runner
#     under Renovate: its github-actions manager bumps a pinned `ubuntu-24.04`
#     via the github-runners datasource (it ignores the `ubuntu-latest`
#     variable), so the next stable image (e.g. 26.04) arrives as a review PR.
#   - step-security/harden-runner runs first in egress-policy: audit — it only
#     records outbound network calls (never blocks), so a compromised action or
#     dependency surfaces in the run's network log.
#   - checkout uses persist-credentials: false so the GITHUB_TOKEN is not left
#     in .git/config for a later step to read — safe here because no job pushes
#     with git (the images job builds only; publishing lives in its own workflow).
#   - timeout-minutes caps each job so a hung test or build can't hold a runner
#     for the 6-hour default.
on:
  pull_request:
  push:
    branches: [main]

# If new commits are pushed to the same branch/PR while a run is in progress,
# cancel the older run so we only spend CI minutes on the latest code.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# dorny/paths-filter reads changed files via the GitHub API on pull_request
# events; without these read scopes the default GITHUB_TOKEN gets
# "Resource not accessible by integration".
permissions:
  contents: read
  pull-requests: read

jobs:
  # Detect which areas changed so we skip gates for unrelated edits (e.g.
  # docs, AGENTS.md) — a docs-only change then costs a single metered minute.
  # Downstream jobs gate on these outputs. The workflow file is in every
  # filter so changes to CI always re-run everything.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      dockerfiles: ${{ steps.filter.outputs.dockerfiles }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              # The backend suite owns the OpenAPI drift test, so a hand-edited
              # spec (or a bad merge resolution) has to re-run it.
              - 'shared/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'shared/**'
              - '.github/workflows/ci.yml'
            dockerfiles:
              - '**/Dockerfile'
              - '.hadolint.yaml'
              - '.github/workflows/ci.yml'

  backend:
    name: Backend (lint, types, tests)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # Docker is preinstalled and running on ubuntu-24.04, which is all the
    # testcontainers-based integration tests (Postgres + Redis) need.
    defaults:
      run:
        working-directory: backend
    env:
      # CI runners can block the testcontainers Ryuk reaper's socket; the
      # ephemeral VM is thrown away after the job, so cleanup isn't needed.
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.3"  # matches backend/pyproject.toml [tool.uv] and Dockerfile
          enable-cache: true
          # Cache invalidates when the backend lockfile changes.
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --all-groups --frozen

      # Every gate below is guarded with `!cancelled()` so the rest keep running
      # after one fails: a single run then reports every problem instead of only
      # the first, matching `fail-fast: false` on the frontend matrix below.
      #
      # Lint and format are check-only here (no --fix / no rewrite): CI must
      # fail on violations, not silently "fix" them like the local justfile does.
      - name: Ruff lint
        if: ${{ !cancelled() }}
        run: uv run ruff check src/fanfan tests scripts --respect-gitignore

      - name: Ruff format check
        if: ${{ !cancelled() }}
        run: uv run ruff format --check src/fanfan tests scripts --respect-gitignore

      # --check only: fail if pyproject.toml's dependency tables aren't sorted,
      # never rewrite them here (same check-only stance as ruff above).
      - name: Dependency sort check (uv-sort)
        if: ${{ !cancelled() }}
        run: uv run uv-sort --check

      - name: Type check (ty)
        if: ${{ !cancelled() }}
        run: uv run ty check src/fanfan

      # Runs unit and integration tests. Integration tests start their own
      # Postgres/Redis containers via testcontainers fixtures.
      - name: Tests
        if: ${{ !cancelled() }}
        run: uv run pytest tests

  frontend:
    # Lint, check, test and build are independent, so we run them as a matrix
    # of parallel jobs instead of sequential steps. Wall-clock time drops to
    # the slowest single task (the build) instead of the sum of all four.
    name: Frontend (${{ matrix.task.name }})
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # `check`, `build` and `test` read PUBLIC_* via `$env/static/public`, which
    # errors on any referenced var that is undefined at build time (`test` pulls
    # PUBLIC_TIMEZONE in through the formatters it covers). Supply them from the
    # same repository variables the publish workflow bakes in (empty is fine — the
    # vars just need to exist). `lint` ignores them.
    env:
      PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
      PUBLIC_APP_VERSION: ${{ vars.PUBLIC_APP_VERSION }}
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
      PUBLIC_TIMEZONE: ${{ vars.PUBLIC_TIMEZONE }}
      PUBLIC_VAPID_KEY: ${{ vars.PUBLIC_VAPID_KEY }}
      PUBLIC_SENTRY_DSN: ${{ vars.PUBLIC_SENTRY_DSN }}
      PUBLIC_SENTRY_ENVIRONMENT: ${{ vars.PUBLIC_SENTRY_ENVIRONMENT }}
      PUBLIC_SENTRY_TRACES_SAMPLE_RATE: ${{ vars.PUBLIC_SENTRY_TRACES_SAMPLE_RATE }}
      PUBLIC_SMARTCAPTCHA_CLIENT_KEY: ${{ vars.PUBLIC_SMARTCAPTCHA_CLIENT_KEY }}
      PUBLIC_VK_GROUP_ID: ${{ vars.PUBLIC_VK_GROUP_ID }}
    strategy:
      # Don't cancel the other tasks when one fails: we want to see every
      # failure (lint, types, tests and build) in a single CI run, not just the first.
      fail-fast: false
      matrix:
        task:
          - { name: lint, command: pnpm lint }
          - { name: check, command: pnpm check }
          - { name: test, command: pnpm test }
          # Regenerates the API types in memory and fails if the committed
          # schema.d.ts differs — a stale one still typechecks, so `check`
          # above cannot see it.
          - { name: api, command: pnpm generate-api:check }
          - { name: build, command: pnpm build }
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          # Explicit version, kept in sync with mise.toml and
          # frontend/package.json "packageManager" by the Renovate "pnpm" group
          # (docs/dependencies.md). We can't omit it and read packageManager
          # instead: v6 fails to resolve it from a subdirectory package.json
          # (pnpm/action-setup#227), and there is no root package.json here.
          version: 11.23.0

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ${{ matrix.task.name }}
        run: ${{ matrix.task.command }}

  dockerfiles:
    name: Dockerfiles (hadolint)
    needs: changes
    if: needs.changes.outputs.dockerfiles == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Lint the Dockerfiles against best practices with hadolint. `recursive`
      # scans every Dockerfile from the repo root, so new ones are covered without
      # touching this workflow. Reads .hadolint.yaml (trusted registries) by default.
      - name: Lint Dockerfiles
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          recursive: true

  # Prove both images still build. hadolint above only parses the Dockerfiles,
  # and until this job existed the only real build ran in docker-publish.yml
  # *after* merge — so anything that breaks a build turned main's publish red
  # instead of the PR that caused it, leaving main unable to ship. That is how
  # PR #360 landed: it bumped four of the five uv pin sites, and the fifth (the
  # builder image tag in backend/Dockerfile) only failed once `uv sync --locked`
  # ran against a uv that no longer matched pyproject's `required-version`.
  #
  # Gated on all three filters because the inputs are wider than the Dockerfiles:
  # backend/uv.lock and backend/pyproject.toml decide whether `uv sync --locked`
  # succeeds, and frontend/pnpm-lock.yaml does the same for the build stage.
  images:
    name: Images (${{ matrix.name }} build)
    needs: changes
    if: |
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.dockerfiles == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Overrides the workflow-level permissions for this job only (the others keep
    # pull-requests: read for paths-filter). packages: read lets the GHCR
    # `:buildcache` pull authenticate once the image packages go private; while
    # they are public it is unused (anonymous pull already works), so this needs
    # no follow-up when the repo's visibility changes.
    permissions:
      contents: read
      packages: read
    strategy:
      # One failing image shouldn't hide the state of the other.
      fail-fast: false
      # Mirrors the matrix in docker-publish.yml — same contexts, same targets.
      matrix:
        include:
          - name: backend
            context: ./backend
            target: ''
          - name: frontend
            context: ./frontend
            target: prod
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      # Best-effort login so the GHCR cache read below authenticates once the
      # image packages are private. continue-on-error because a missing cache is
      # a cold build, never a failure: a fork PR gets a read-only token that
      # cannot authenticate here, and it must not fail the job — the build just
      # runs without the cache (public packages are readable anonymously anyway).
      - name: Log in to GHCR
        continue-on-error: true
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No build-args: they only decide what gets baked into the bundle, not
      # whether the build succeeds, and the publish workflow supplies the real
      # values. `push: false` — this job only proves the build, so it needs no
      # packages: write (the login above is read-only, for the cache).
      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: false
          # Read the GHCR layer cache docker-publish.yml writes on main (a PR
          # branch reads its base branch's cache). Deliberately no cache-to: a
          # PR build must not overwrite main's `:buildcache` tag. Matches the
          # ref the publish workflow writes: ghcr.io/<owner>/<repo>-<name>.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}-${{ matrix.name }}:buildcache
