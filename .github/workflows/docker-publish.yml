name: Publish Docker images

# Build the backend and frontend images once in CI and push them to the GitHub
# Container Registry (GHCR), so the server can pull prebuilt images instead of
# building from source. Runs on pushes to `main` (moves the `latest` tag) and on
# version tags `v*` (publishes that release).
on:
  push:
    branches: [main]
    tags: ['v*']
  # Manual rebuild — use after changing a frontend PUBLIC_* repository variable,
  # since those are baked in at build time and a variable change alone does not
  # trigger a build. Run from the Actions tab on the `main` branch.
  workflow_dispatch:

# Cancel an in-progress publish for the same ref when a newer commit arrives.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build and push (${{ matrix.name }})
    # Pinned to ubuntu-24.04, not the floating `ubuntu-latest` label GitHub
    # migrates without notice. Pinning also lets Renovate's github-actions
    # manager propose the runner bump via the github-runners datasource; it
    # ignores the `ubuntu-latest` variable, so a pin is what gets tracked.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      # Required to push images to GHCR with the automatic GITHUB_TOKEN.
      packages: write
    strategy:
      fail-fast: false
      # One image per service kind. The backend image is shared by the api,
      # faststream, scheduler and migration services (they differ only by command).
      matrix:
        include:
          - name: backend
            context: ./backend
            image: ${{ github.repository }}-backend
            target: ''
          - name: frontend
            context: ./frontend
            image: ${{ github.repository }}-frontend
            target: prod
    steps:
      # Records outbound network calls (audit only, never blocks) so a
      # compromised action or dependency surfaces in the run's network log.
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      # persist-credentials: false keeps the GITHUB_TOKEN out of .git/config;
      # this job authenticates to GHCR with docker login, not git, so nothing
      # here needs the checkout credential.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A mixed-case owner login (github.repository keeps it verbatim) yields a
      # ref like ghcr.io/Arutemu64/…, which buildx rejects on the cache exporter
      # ("repository name must be lowercase"). metadata-action lowercases its own
      # tags, but the raw cache-from/to refs below do not — so lowercase once here.
      - name: Lowercase image ref
        id: image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ matrix.image }}
        run: echo "ref=${IMAGE,,}" >> "$GITHUB_OUTPUT"

      # Derives image tags/labels from the git ref. metadata-action lowercases
      # the image name, so a mixed-case owner login still produces a valid tag.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          # `type=sha` is the identity a deploy actually pins (IMAGE_TAG=sha-…);
          # the semver patterns give a `v1.2.3` tag the rolling `1.2` and `1`
          # aliases too, so a pin can choose how much drift it accepts.
          tags: |
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          # The server is amd64. Add linux/arm64 here if that ever changes.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Frontend build args. PUBLIC_* are baked into the static SPA bundle at
          # build time ($env/static/public) — they come from public, non-secret
          # repository variables. The unprefixed SENTRY_* args are build-time only
          # (the source-map upload target, read by vite.config.ts) and never reach
          # the bundle; leave those variables unset to skip the upload.
          # SENTRY_RELEASE is the commit SHA, matching the image's `type=sha` tag —
          # the build context is ./frontend with no .git in it, so the Sentry plugin
          # cannot detect the commit itself. Each line for the other image evaluates
          # to an empty string, which build-push-action ignores.
          # The last two lines carry that same SHA into each image as its build id:
          # PUBLIC_APP_VERSION reaches the profile footer, APP_BUILD becomes the
          # backend's Sentry release. Both sides of a deploy then report the same
          # release, which is what makes "did this deploy break it" answerable.
          build-args: |
            ${{ matrix.name == 'frontend' && format('PUBLIC_API_URL={0}', vars.PUBLIC_API_URL) || '' }}
            ${{ matrix.name == 'frontend' && format('PUBLIC_SITE_URL={0}', vars.PUBLIC_SITE_URL) || '' }}
            ${{ matrix.name == 'frontend' && format('PUBLIC_TIMEZONE={0}', vars.PUBLIC_TIMEZONE) || '' }}
            ${{ matrix.name == 'frontend' && format('PUBLIC_VAPID_KEY={0}', vars.PUBLIC_VAPID_KEY) || '' }}
            ${{ matrix.name == 'frontend' && format('PUBLIC_SENTRY_DSN={0}', vars.PUBLIC_SENTRY_DSN) || '' }}
            ${{ matrix.name == 'frontend' && format('PUBLIC_SENTRY_ENVIRONMENT={0}', vars.PUBLIC_SENTRY_ENVIRONMENT) || '' }}
            ${{ matrix.name == 'frontend' && format('PUBLIC_SENTRY_TRACES_SAMPLE_RATE={0}', vars.PUBLIC_SENTRY_TRACES_SAMPLE_RATE) || '' }}
            ${{ matrix.name == 'frontend' && format('PUBLIC_SMARTCAPTCHA_CLIENT_KEY={0}', vars.PUBLIC_SMARTCAPTCHA_CLIENT_KEY) || '' }}
            ${{ matrix.name == 'frontend' && format('PUBLIC_VK_GROUP_ID={0}', vars.PUBLIC_VK_GROUP_ID) || '' }}
            ${{ matrix.name == 'frontend' && format('SENTRY_URL={0}', vars.SENTRY_URL) || '' }}
            ${{ matrix.name == 'frontend' && format('SENTRY_ORG={0}', vars.SENTRY_ORG) || '' }}
            ${{ matrix.name == 'frontend' && format('SENTRY_PROJECT={0}', vars.SENTRY_PROJECT) || '' }}
            ${{ matrix.name == 'frontend' && format('SENTRY_RELEASE={0}', github.sha) || '' }}
            ${{ matrix.name == 'frontend' && format('PUBLIC_APP_VERSION={0}', github.sha) || '' }}
            ${{ matrix.name == 'backend' && format('APP_BUILD={0}', github.sha) || '' }}
          # SENTRY_AUTH_TOKEN (a secret) uploads source maps in the `build` stage,
          # together with the SENTRY_URL/ORG/PROJECT args above — all four are
          # required or the upload is skipped. The token is passed as a BuildKit
          # secret — unlike a build arg, it never lands in image layer metadata or
          # the exported GHA build cache below.
          secrets: |
            ${{ matrix.name == 'frontend' && format('sentry_auth_token={0}', secrets.SENTRY_AUTH_TOKEN) || '' }}
          # Registry-backed layer cache on GHCR, not the GitHub Actions cache.
          # Two mode=max image caches (backend + frontend) overran the 10 GB
          # Actions-cache pool and evicted the pnpm/uv dependency caches that
          # share it. A dedicated `:buildcache` tag per image lives in GHCR,
          # outside that pool — it neither evicts those caches nor gets evicted,
          # and gives each image its own ref instead of colliding on one default
          # gha scope. image-manifest + oci-mediatypes store the cache as a
          # standard OCI artifact, which GHCR requires.
          cache-from: type=registry,ref=${{ steps.image.outputs.ref }}:buildcache
          cache-to: type=registry,ref=${{ steps.image.outputs.ref }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
