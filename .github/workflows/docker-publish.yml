name: Publish Docker images

# Build the backend and frontend images once in CI and push them to the GitHub
# Container Registry (GHCR), so the server can pull prebuilt images instead of
# building from source. Runs on pushes to `main` (moves the `latest` tag) and on
# version tags `v*` (publishes that release).
on:
  push:
    branches: [main]
    tags: ['v*']
  # Manual rebuild — use after changing a frontend PUBLIC_* repository variable,
  # since those are baked in at build time and a variable change alone does not
  # trigger a build. Run from the Actions tab on the `main` branch.
  workflow_dispatch:

# Cancel an in-progress publish for the same ref when a newer commit arrives.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build and push (${{ matrix.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to push images to GHCR with the automatic GITHUB_TOKEN.
      packages: write
    strategy:
      fail-fast: false
      # One image per service kind. The backend image is shared by the api,
      # faststream, scheduler and migration services (they differ only by command).
      matrix:
        include:
          - name: backend
            context: ./backend
            image: ${{ github.repository }}-backend
            target: ''
          - name: frontend
            context: ./frontend
            image: ${{ github.repository }}-frontend
            target: prod
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derives image tags/labels from the git ref. metadata-action lowercases
      # the image name, so a mixed-case owner login still produces a valid tag.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          tags: |
            type=sha
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          # The server is amd64. Add linux/arm64 here if that ever changes.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Frontend build args. PUBLIC_* are baked into the static SPA bundle at
          # build time ($env/static/public) — they come from public, non-secret
          # repository variables. For the backend each line evaluates to an empty
          # string, which build-push-action ignores.
          build-args: |
            ${{ matrix.name == 'frontend' && format('PUBLIC_API_URL={0}', vars.PUBLIC_API_URL) || '' }}
            ${{ matrix.name == 'frontend' && format('PUBLIC_VAPID_KEY={0}', vars.PUBLIC_VAPID_KEY) || '' }}
            ${{ matrix.name == 'frontend' && format('PUBLIC_SENTRY_DSN={0}', vars.PUBLIC_SENTRY_DSN) || '' }}
            ${{ matrix.name == 'frontend' && format('PUBLIC_TURNSTILE_SITE_KEY={0}', vars.PUBLIC_TURNSTILE_SITE_KEY) || '' }}
          # SENTRY_AUTH_TOKEN (a secret) uploads source maps in the `build` stage.
          # It is passed as a BuildKit secret — unlike a build arg, it never lands
          # in image layer metadata or the exported GHA build cache below.
          secrets: |
            ${{ matrix.name == 'frontend' && format('sentry_auth_token={0}', secrets.SENTRY_AUTH_TOKEN) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
