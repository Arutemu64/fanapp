name: Publish Docker images

# Build the backend and frontend images once in CI and push them to the GitHub
# Container Registry (GHCR), so the server can pull prebuilt images instead of
# building from source. Runs on pushes to `main` (moves the `latest` tag) and on
# version tags `v*` (publishes that release).
on:
  push:
    branches: [main]
    tags: ['v*']

# Cancel an in-progress publish for the same ref when a newer commit arrives.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build and push (${{ matrix.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to push images to GHCR with the automatic GITHUB_TOKEN.
      packages: write
    strategy:
      fail-fast: false
      # One image per service kind. The backend image is shared by the api,
      # faststream, scheduler and migration services (they differ only by command).
      matrix:
        include:
          - name: backend
            context: ./backend
            image: ${{ github.repository }}-backend
            target: ''
          - name: frontend
            context: ./frontend
            image: ${{ github.repository }}-frontend
            target: prod
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derives image tags/labels from the git ref. metadata-action lowercases
      # the image name, so a mixed-case owner login still produces a valid tag.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          tags: |
            type=sha
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          # The server is amd64. Add linux/arm64 here if that ever changes.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # SENTRY_AUTH_TOKEN is only used by the frontend build (source-map
          # upload). It is consumed in the discarded `build` stage, so it never
          # reaches the published `prod` image. Backend gets no build args.
          build-args: ${{ matrix.name == 'frontend' && format('SENTRY_AUTH_TOKEN={0}', secrets.SENTRY_AUTH_TOKEN) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
